name: server release

# Build Server tarball + Docker image and publish a GitHub Release.
# Tag version must equal packages/server/package.json version.
# Example:
#   VERSION=$(bun -e "console.log(require('./packages/server/package.json').version)")
#   git tag -a "server-v${VERSION}" -m "server ${VERSION}"
#   git push origin "server-v${VERSION}"
on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/runmark-server

jobs:
  release:
    name: package · docker · github release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate tag vs package.json
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            server-v*) ;;
            *) echo "ERROR: tag must start with server-v, got: $TAG"; exit 1 ;;
          esac
          VERSION="${TAG#server-v}"
          PKG_VERSION=$(bun -e "console.log(require('./packages/server/package.json').version)")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag version '${VERSION}' != packages/server/package.json '${PKG_VERSION}'"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "ERROR: invalid semver: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag OK: $TAG -> server v$VERSION"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Package server tarball
        run: bash scripts/release/package-server.sh "${{ steps.ver.outputs.version }}"

      - name: Generate server-manifest.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run scripts/release/generate-manifest.ts "${{ steps.ver.outputs.version }}"

      - name: Prepare release notes
        run: bash scripts/release/create-release-notes.sh "${{ steps.ver.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.ver.outputs.version, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="server-v${VERSION}"
          NOTES_FILE="dist/release-body.md"
          ASSETS=(
            "dist/agent-tracker-server-v${VERSION}.tar.gz"
            "dist/agent-tracker-server-v${VERSION}.tar.gz.sha256"
            "dist/server-manifest.json"
          )
          for f in "${ASSETS[@]}"; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          gh release create "$TAG" \
            --title "Server v${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --latest \
            "${ASSETS[@]}"
