name: npm release

# Publish client packages to npmjs when an npm-v* tag is pushed.
# Tag is for trigger/tracking only; published versions come from package.json.
# Example: git tag -a npm-v0.1.0 -m "npm clients first release" && git push origin npm-v0.1.0
on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish @runmarks/*
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "ERROR: repository secret NPM_TOKEN is missing."
            echo "Set it at: Settings → Secrets and variables → Actions → Repository secrets"
            echo "Or: gh secret set NPM_TOKEN --repo yee94/runmark"
            exit 1
          fi

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install pnpm (for changesets)
        run: npm install --global pnpm@8.15.9

      - name: Build publishable packages
        run: |
          bun run --filter @runmarks/opencode-plugin build
          bun run --filter @runmarks/codex-plugin build
          bun run --filter @runmarks/grok-plugin build
          bun run --filter @runmarks/claude-compat-plugin build
          bun run --filter @runmarks/cursor-hooks build

      - name: Publish packages to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Explicit auth for npm CLI (setup-node also writes .npmrc)
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
          printf '%s\n' "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
          printf '%s\n' "always-auth=true" >> "$HOME/.npmrc"

          # Prefer changesets when available (skips already-published versions).
          # Do not npm publish the same versions in parallel: npm leaves them "staged" and the second PUT 409s.
          if [ -x node_modules/.bin/changeset ]; then
            echo "==> changeset publish"
            npx changeset publish || echo "changeset publish failed; reconciling missing versions"
          fi

          echo "==> waiting for the registry to list new versions"
          sleep 15

          # Reconcile anything changeset reported but npmjs does not list yet.
          pkgs=(
            packages/runmark
            packages/plugin-opencode
            packages/plugin-codex
            packages/plugin-grok
            packages/plugin-claude-compat
            packages/hook-cursor
          )
          for dir in "${pkgs[@]}"; do
            name=$(node -p "require('./${dir}/package.json').name")
            ver=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${ver}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "==> skip ${name}@${ver} (already on npm)"
              continue
            fi
            echo "==> npm publish ${name}@${ver}"
            published=0
            for attempt in 1 2 3; do
              if npm publish "./${dir}" --access public --ignore-scripts --registry=https://registry.npmjs.org/; then
                published=1
                break
              fi
              echo "==> publish attempt ${attempt} failed for ${name}@${ver}; retrying"
              sleep 10
              if npm view "${name}@${ver}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
                echo "==> ${name}@${ver} is on npm"
                published=1
                break
              fi
            done
            if [ "$published" -ne 1 ]; then
              echo "ERROR: failed to publish ${name}@${ver}"
              exit 1
            fi
          done

          echo "==> published versions:"
          for dir in "${pkgs[@]}"; do
            name=$(node -p "require('./${dir}/package.json').name")
            npm view "${name}" version --registry=https://registry.npmjs.org/ 2>/dev/null || echo "${name}: (not found)"
          done
