<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Runmark</title>
  <link rel="stylesheet" href="https://unpkg.com/@eficy/shadcn-ui@1.1.3/dist/index.css" />
  <style>
    :root {
      --ease-smooth: cubic-bezier(0.32, 0.72, 0, 1);
      --brand-blue: #3b9eff;
      --brand-orange: #ff9a4d;
      --brand-purple: #b86dff;
      --brand-green: #4ade80;
      --brand-green-deep: #34d399;
      --progress-safe: #45DE6B;
      --progress-warn: #FFC73D;
      --progress-danger: #ff6b7a;
      --control-fill: rgba(255, 255, 255, 0.05);
      --control-stroke: rgba(255, 255, 255, 0.08);
      --panel-fill-start: rgba(255, 255, 255, 0.06);
      --panel-fill-end: rgba(255, 255, 255, 0.02);
      --panel-stroke: rgba(255, 255, 255, 0.08);
      --panel-shadow: rgba(0, 0, 0, 0.45);
      --bg-base: #08090d;
      --bg-elevated: #0f1118;
      --bg-surface: #13151e;
      --text-primary: #eef0f6;
      --text-secondary: rgba(238, 240, 246, 0.58);
      --text-muted: rgba(238, 240, 246, 0.34);
      --radius-panel: 16px;
      --radius-row: 10px;
      --radius-small: 10px;
      --font-sans: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, "Cascadia Code", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      background: var(--bg-base);
      min-height: 100vh;
    }

    /* Ambient background — aurora + grid */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: var(--bg-base);
    }
    .ambient::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, black 20%, transparent 75%);
    }
    .glow-blue {
      position: absolute;
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 158, 255, 0.18) 0%, transparent 70%);
      filter: blur(60px);
      top: -200px; left: -100px;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .glow-green {
      position: absolute;
      width: 480px; height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.12) 0%, transparent 70%);
      filter: blur(70px);
      bottom: -120px; right: 10%;
      animation: drift 22s ease-in-out infinite alternate-reverse;
    }
    .glow-orange {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 109, 255, 0.14) 0%, transparent 70%);
      filter: blur(65px);
      top: 20%; right: -80px;
      animation: drift 20s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 20px) scale(1.05); }
    }

    .digits {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--control-stroke);
      border-top-color: var(--brand-blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    .spinner-lg {
      width: 36px; height: 36px;
      border-width: 3px;
      border-color: var(--control-stroke);
      border-top-color: var(--brand-blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* 登录页 */
    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 28px 28px 24px;
      border-radius: var(--radius-panel);
      background: linear-gradient(145deg, var(--panel-fill-start), var(--panel-fill-end));
      border: 1px solid var(--panel-stroke);
      box-shadow: 0 24px 48px var(--panel-shadow);
    }
    .login-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0 0 20px;
      line-height: 1.5;
    }
    .login-hint {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius-small);
      background: rgba(59, 158, 255, 0.08);
      border: 1px solid rgba(59, 158, 255, 0.18);
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.55;
    }
    .login-hint code {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--brand-blue);
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .login-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .login-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-small);
      border: 1px solid var(--control-stroke);
      background: var(--control-fill);
      color: var(--text-primary);
      font-size: 14px;
      font-family: var(--font-mono);
    }
    .login-input:focus {
      outline: none;
      border-color: rgba(59, 158, 255, 0.45);
    }
    .login-error {
      font-size: 12px;
      color: var(--progress-danger);
      margin-bottom: 10px;
    }
    .login-btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: var(--radius-small);
      background: linear-gradient(135deg, var(--brand-blue), #2b7fd4);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-ghost-sm {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--control-stroke);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }
    .btn-ghost-sm:hover {
      border-color: var(--brand-blue);
      color: var(--text-primary);
    }

    .cursor-token-input {
      field-sizing: fixed !important;
      height: 88px !important;
      min-height: 88px !important;
      max-height: 88px !important;
      overflow-y: auto !important;
      resize: none !important;
      word-break: break-all;
    }

    /* Page load fade */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s var(--ease-smooth) both; }
    .fade-up-d1 { animation-delay: 0.05s; }
    .fade-up-d2 { animation-delay: 0.10s; }
    .fade-up-d3 { animation-delay: 0.15s; }
    .fade-up-d4 { animation-delay: 0.20s; }

    /* Refresh spin */
    @keyframes spin-once { to { transform: rotate(360deg); } }
    .refresh-spin { animation: spin-once 0.5s var(--ease-smooth); }

    /* panelCard — 万能卡片容器 */
    .panel-card {
      position: relative;
      padding: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid var(--panel-stroke);
      border-radius: var(--radius-panel);
      box-shadow: 0 16px 40px var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,0.06);
      transition: border-color 0.3s var(--ease-smooth), box-shadow 0.3s var(--ease-smooth);
      overflow: hidden;
    }
    .panel-card::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }
    .panel-card--chart {
      overflow: visible;
    }

    .logo-mark {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(59,158,255,0.25), rgba(184,109,255,0.25));
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 24px rgba(59,158,255,0.2);
      color: #fff;
    }
    .gradient-text {
      background: linear-gradient(135deg, #fff 30%, rgba(184,109,255,0.9) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* KPI cards */
    .kpi-card {
      position: relative;
      padding: 18px 18px 16px;
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
      transition: transform 0.3s var(--ease-smooth), box-shadow 0.3s var(--ease-smooth), border-color 0.3s;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0.9;
    }
    .kpi-card::after {
      content: '';
      position: absolute;
      top: -40px; right: -20px;
      width: 100px; height: 100px;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.35;
      pointer-events: none;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.12);
    }
    .kpi-card--blue::before { background: linear-gradient(90deg, var(--brand-blue), transparent); }
    .kpi-card--blue::after { background: var(--brand-blue); }
    .kpi-card--blue:hover { box-shadow: 0 12px 32px rgba(59,158,255,0.12); }
    .kpi-card--green::before { background: linear-gradient(90deg, var(--brand-green), transparent); }
    .kpi-card--green::after { background: var(--brand-green); }
    .kpi-card--green:hover { box-shadow: 0 12px 32px rgba(74,222,128,0.1); }
    .kpi-card--orange::before { background: linear-gradient(90deg, var(--brand-orange), transparent); }
    .kpi-card--orange::after { background: var(--brand-orange); }
    .kpi-card--orange:hover { box-shadow: 0 12px 32px rgba(255,154,77,0.1); }
    .kpi-card--purple::before { background: linear-gradient(90deg, var(--brand-purple), transparent); }
    .kpi-card--purple::after { background: var(--brand-purple); }
    .kpi-card--purple:hover { box-shadow: 0 12px 32px rgba(184,109,255,0.12); }

    .kpi-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .kpi-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .kpi-icon--blue { background: rgba(59,158,255,0.15); color: var(--brand-blue); }
    .kpi-icon--green { background: rgba(74,222,128,0.15); color: var(--brand-green); }
    .kpi-icon--orange { background: rgba(255,154,77,0.15); color: var(--brand-orange); }
    .kpi-icon--purple { background: rgba(184,109,255,0.15); color: var(--brand-purple); }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      font-family: var(--font-mono);
      color: var(--text-primary);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .kpi-sub {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .section-title-main {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      margin: 0;
    }
    .section-title-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 6px 0 0;
      line-height: 1.4;
    }
    .section-title-block {
      margin-bottom: 16px;
    }
    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .section-title-actions {
      flex-shrink: 0;
    }

    .page-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text-primary);
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .topbar-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .topbar-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Capsule 控件 */
    .btn-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--control-fill);
      border: 1px solid var(--control-stroke);
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.3s var(--ease-smooth);
    }
    .btn-capsule:hover {
      background: var(--panel-fill-start);
    }
    .btn-capsule:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Cursor 设置向导 */
    .setup-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .setup-step {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }
    .setup-step--done {
      border-color: rgba(52, 211, 153, 0.25);
      background: rgba(52, 211, 153, 0.06);
    }
    .setup-step--warn {
      border-color: rgba(251, 191, 36, 0.25);
      background: rgba(251, 191, 36, 0.06);
    }
    .setup-step-num {
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
    }
    .setup-step--done .setup-step-num {
      background: rgba(52, 211, 153, 0.2);
      color: #6ee7b7;
    }
    .setup-code {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.55;
      color: #c4b5fd;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.06);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .btn-circle {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--control-fill);
      border: 1px solid var(--control-stroke);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.25s var(--ease-smooth);
    }
    .btn-circle:hover {
      background: var(--panel-fill-start);
    }
    .btn-circle:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 9999px;
      transition: all 0.35s var(--ease-smooth);
    }
    .status-pill--ready {
      color: var(--brand-green);
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }
    .status-pill--warn {
      color: var(--progress-warn);
      background: rgba(255, 199, 61, 0.12);
      border: 1px solid rgba(255, 199, 61, 0.22);
    }
    .status-pill--error {
      color: var(--progress-danger);
      background: rgba(255, 107, 122, 0.12);
      border: 1px solid rgba(255, 107, 122, 0.2);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--brand-green);
      box-shadow: 0 0 8px var(--brand-green);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--brand-green); }
      50% { opacity: 0.6; box-shadow: 0 0 4px var(--brand-green); }
    }

    /* Nav pills — Capsule segmented */
    .nav-pills {
      display: inline-flex;
      gap: 2px;
      padding: 4px;
      background: var(--control-fill);
      border: 1px solid var(--control-stroke);
      border-radius: 9999px;
    }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 9999px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.3s var(--ease-smooth);
      user-select: none;
      white-space: nowrap;
    }
    .nav-pill:hover {
      color: var(--text-primary);
    }
    .nav-pill--active {
      color: var(--text-primary);
      background: var(--panel-fill-start);
      border-color: var(--control-stroke);
    }

    /* Badge styles */
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 9999px;
      font-size: 10px; font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }
    .badge-provider {
      color: var(--brand-purple);
      background: rgba(184, 109, 255, 0.12);
      border: 1px solid rgba(184, 109, 255, 0.22);
    }
    .badge-agent {
      color: var(--brand-green);
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }
    .count-chip {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: 9999px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* 统计筛选条 */
    .stats-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 16px;
      margin-bottom: 14px;
    }
    .stats-filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .stats-filter-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .filter-chip {
      padding: 5px 10px;
      border-radius: 9999px;
      border: 1px solid var(--control-stroke);
      background: var(--control-fill);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      user-select: none;
    }
    .filter-chip:hover {
      border-color: rgba(59,158,255,0.35);
      color: var(--text-primary);
    }
    .filter-chip--active {
      border-color: rgba(59,158,255,0.5);
      background: rgba(59,158,255,0.12);
      color: var(--brand-blue);
      font-weight: 600;
    }

    /* 列表行 */
    .list-row {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: var(--radius-row);
      transition: background 0.25s var(--ease-smooth);
      cursor: default;
    }
    .list-row--clickable { cursor: pointer; }
    .list-row--clickable:hover,
    .list-row:hover {
      background: rgba(255,255,255,0.04);
    }
    .list-row--clickable:hover {
      box-shadow: inset 2px 0 0 var(--brand-blue);
    }
    .list-row--active {
      background: rgba(59,158,255,0.08);
      box-shadow: inset 2px 0 0 var(--brand-blue);
    }
    .session-summary-col {
      flex: 2.8;
      min-width: 180px;
    }
    .session-summary-text {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .list-header {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .list-divider {
      height: 1px;
      background: var(--control-stroke);
      opacity: 0.25;
      margin: 4px 0;
    }

    /* Session detail */
    .session-detail {
      background: var(--control-fill);
      border-top: 1px solid var(--panel-stroke);
    }
    .msg-bubble {
      background: linear-gradient(to bottom right, var(--panel-fill-start), var(--panel-fill-end));
      border: 1px solid var(--panel-stroke);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .msg-bubble--user { border-left: 2px solid var(--brand-blue); }
    .msg-bubble--assistant { border-left: 2px solid var(--brand-purple); }
    .msg-bubble--tool { border-left: 2px solid var(--brand-orange); }

    /* Dense trace — 参考 html-debug-report */
    .trace-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 12px;
      min-height: 420px;
    }
    .trace-panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--panel-stroke);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .trace-panel-head {
      padding: 7px 12px;
      border-bottom: 1px solid var(--panel-stroke);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .trace-list { overflow-y: auto; flex: 1; max-height: 560px; }
    .trace-row {
      display: grid;
      grid-template-columns: 26px 20px minmax(0, 1fr) 68px 56px 56px;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      height: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      border-left: 2px solid transparent;
      cursor: pointer;
      font-size: 11px;
      transition: background 0.15s var(--ease-smooth);
    }
    .trace-row:hover { background: rgba(255,255,255,0.04); }
    .trace-row--sel {
      background: rgba(59,158,255,0.1);
      border-left-color: var(--brand-blue);
    }
    .trace-seq {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
    }
    .trace-summary {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-secondary);
    }
    .trace-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
    }
    .trace-role-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      margin: 0 auto;
    }
    .trace-role-dot--user { background: var(--brand-blue); }
    .trace-role-dot--assistant { background: var(--brand-purple); }
    .trace-role-dot--turn { background: var(--brand-green); }
    .trace-role-dot--turn-fail { background: var(--progress-danger); }
    .trace-role-dot--tool { background: var(--brand-orange); }
    .trace-role-dot--subagent { background: var(--brand-purple); }
    .trace-row--nested { padding-left: 18px; }
    .trace-row--subagent .trace-summary { font-weight: 600; color: var(--text-primary); }
    .trace-expand-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-right: 2px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
    }
    .trace-expand-btn:hover { color: var(--text-primary); }
    .trace-detail {
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      flex: 1;
      max-height: 560px;
    }
    .trace-detail-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .trace-meta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--panel-stroke);
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .trace-meta-item {
      display: inline-flex;

    }
    .trace-meta-label {

    .trace-meta-bar .trace-meta-val {

    }
    .trace-meta-bar .trace-meta-val--summary {
      max-width: min(48vw, 520px);

      text-overflow: ellipsis;

    }
    .trace-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--control-stroke);

      cursor: pointer;
      margin-bottom: 12px;
      transition: border-color 0.2s, color 0.2s;
    }
    .trace-back:hover { border-color: var(--brand-blue); color: var(--text-primary); }

    .trace-row--fork-from {
      background: rgba(56, 132, 255, 0.08);
      border-left: 2px solid var(--brand-blue);
      cursor: pointer;
    }
    .trace-row--fork-from .trace-summary {
      color: var(--brand-blue);
      font-weight: 600;
    }
    .trace-role-dot--fork-from {
      background: var(--brand-blue);
      box-shadow: 0 0 0 2px rgba(56, 132, 255, 0.25);

    .trace-turn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .trace-turn-stat {
      padding: 8px 10px;

    }
    .trace-turn-stat b {

    @media (max-width: 900px) {
      .trace-shell { grid-template-columns: 1fr; }

    .empty-state {
      display: flex;
      flex-direction: column;

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }

    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .app-shell {

    /* shadcn Dialog 需高于顶栏，否则遮罩/关闭按钮无法点击 */
    [data-radix-dialog-overlay] {

    [data-radix-dialog-content] {

    /* PC 后台顶栏 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 28px;
      background: rgba(8, 9, 13, 0.75);
      border-bottom: 1px solid rgba(255,255,255,0.06);

      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;

    /* PC 后台主体：侧栏 + 内容区 */
    .dashboard-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .sidebar {
      width: 232px;
      flex-shrink: 0;
      padding: 24px 16px;
      border-right: 1px solid rgba(255,255,255,0.06);

    .main-content {
      flex: 1;

    }
    .page-eyebrow {
      font-size: 10px;

    /* 总览分析 */
    .summary-stack {

    .token-legend-row {

    .token-legend-label {

    }
    .token-legend-dot {
      width: 8px;

      flex-shrink: 0;
    }
    .token-legend-val {
      font-family: var(--font-mono);

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .metric-cell {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .metric-cell-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .metric-cell-val {
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .metric-cell-sub {
      margin-top: 2px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      width: 100%;
      min-width: 0;
      height: 120px;
      padding-top: 8px;
    }
    .bar-chart-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;

    .bar-chart-bar {
      width: 100%;

      border-radius: 4px 4px 0 0;

    /* 叠加柱 — stacked segment bar */
    .bar-chart-stack {

    }
    .bar-chart-tip::after {
      content: '';

      left: 50%;

    .bar-chart-tip-date {

    }
    .bar-chart-tip-summary {

    }
    .bar-chart-tip-row {

    .bar-chart-tip-label {

    }
    .bar-chart-tip-val {

      white-space: nowrap;

    }
    .bar-chart-tip-more {
      font-size: 10px;
      color: var(--text-muted);
      padding-left: 13px;
    }
    /* 模型图例（可换行） */
    .daily-trend-wrap {
      width: 100%;
      min-width: 0;
    }
    .bar-chart-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      align-content: flex-start;
      gap: 8px 14px;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      padding: 12px 0 0;

    }
    .bar-chart-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      min-width: 0;
    }
    .bar-chart-legend-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-chart-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .bar-chart-label {
      font-size: 9px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;

    .hbar-list {

<body>
  <div class="ambient">
    <div class="glow-blue"></div>
    <div class="glow-green"></div>
    <div class="glow-orange"></div>
  </div>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "shadcn": "https://unpkg.com/@eficy/shadcn-ui@1.1.3/dist/index.js"
    }
  }
  </script>

  <script type="text/eficy">
    import { initEficy, render, signal, computed, effect, component, bind, peek, batch } from 'eficy'
    import * as shadcnUi from 'shadcn'

    // ─── Destructure shadcn components ───
    const {
      Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter,
      Table, TableHeader, TableBody, TableHead, TableRow, TableCell,
      Tabs, TabsList, TabsTrigger, TabsContent,
      Button, Badge, Separator, ScrollArea,
      Tooltip, TooltipProvider, TooltipTrigger, TooltipContent,
      Dialog, DialogClose, DialogContent, DialogDescription, DialogFooter, DialogHeader, DialogTitle,
      Input, Textarea, Label,
    } = shadcnUi

    // ─── Signals ───
    const summary = signal(null)
    const byModel = signal([])
    const byAgent = signal([])
    const dailyStats = signal([])
    const sessions = signal([])
    const loading = signal(true)
    const refreshing = signal(false)
    const activeTab = signal('summary')
    const routeSessionId = signal(null)
    const selectedTraceKey = signal(null)
    const sessionDetails = signal({})
    const expandedSubagents = signal({})
    const lastRefreshed = signal(null)
    const statsRange = signal('month')
    const modelSort = signal('cost')
    const authenticated = signal(false)
    const authChecking = signal(true)
    const authError = signal('')
    const loginPassword = signal('')
    const loginSubmitting = signal(false)
    const isPublicDashboard = signal(false)
    const cursorStatus = signal(null)
    const cursorDialogOpen = signal(false)
    const cursorTokenInput = signal('')
    const cursorSaving = signal(false)
    const cursorSyncing = signal(false)
    const cursorError = signal('')
    const cursorMessage = signal('')
    const hoveredDailyRow = signal(null)
    const dailyChartMetric = signal('cost')

    /** 带 Cookie 的 API 请求（Dashboard 登录态） */
    function apiFetch(url, options) {
      return fetch(url, { credentials: 'include', ...options })
    }

    async function checkAuth() {
      authChecking.value = true
      try {
        const res = await apiFetch('/auth/session')
        const data = await res.json()
        isPublicDashboard.value = !!data.public
        authenticated.value = !!data.authenticated
        if (data.authenticated) {
          syncRouteFromHash()
          await Promise.all([fetchData(false), fetchCursorStatus()])
          startAutoRefresh()
        }
      } catch {
        authenticated.value = false
      } finally {
        authChecking.value = false
      }
    }

    async function login() {
      authError.value = ''
      loginSubmitting.value = true
      try {
        const res = await apiFetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: loginPassword.value }),
        })
        if (!res.ok) {
          authError.value = '密码错误。请使用当前服务（' + location.host + '）配置的访问密码，不是其他环境的密码'
          return
        }
        authenticated.value = true
        loginPassword.value = ''
        syncRouteFromHash()
        await Promise.all([fetchData(false), fetchCursorStatus()])
        startAutoRefresh()
      } catch {
        authError.value = '登录失败，请稍后重试'
      } finally {
        loginSubmitting.value = false
      }
    }

    async function logout() {
      try {
        await apiFetch('/auth/logout', { method: 'POST' })
      } catch {}
      if (refreshTimer) clearInterval(refreshTimer)
      batch(() => {
        authenticated.value = false
        loading.value = true
        summary.value = null
        byModel.value = []
        byAgent.value = []
        dailyStats.value = []
        sessions.value = []
      })
    }

    const RANGE_OPTIONS = [

    function formatPct(n) {
      if (n == null || !Number.isFinite(n)) return '0%'
      return (n * 100).toFixed(1) + '%'
    }

    function pctPart(part, total) {

    // 模型叠加柱配色（暗色背景友好，避免全蓝）
    const MODEL_COLORS = [

      '#38bdf8', '#fbbf24', '#a78bfa', '#2dd4bf',
      '#fb923c', '#818cf8', '#f472b6', '#34d399',
    ]
    const _modelColorMap = {}
    let _modelColorIdx = 0
    function colorForModel(label) {
      if (!label) return MODEL_COLORS[0]
      if (_modelColorMap[label]) return _modelColorMap[label]

    function formatDateShort(iso) {
      if (!iso) return '—'
      const d = new Date(iso + 'T00:00:00')
      if (Number.isNaN(d.getTime())) return String(iso).slice(5)
      return (d.getMonth() + 1) + '/' + d.getDate()
    }

    // ─── Formatters ───
    function formatTokens(n) {
      if (n == null) return '0'
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M'
      if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K'
      return String(n)
    }

    function formatCost(cny) {
      if (cny == null) return '¥0.00'
      if (cny >= 1000) return '¥' + cny.toFixed(2)
      if (cny >= 1) return '¥' + cny.toFixed(2)
      return '¥' + cny.toFixed(4)
    }

    function formatDuration(ms) {
      if (ms == null) return '—'
      if (ms >= 60000) return (ms / 60000).toFixed(1) + ' min'
      if (ms >= 1000) return (ms / 1000).toFixed(1) + 's'
      return ms + 'ms'
    }

    /** 会话持续时间（缩写）：started → 最后一条消息或 ended_at */
    function formatSessionDuration(ms) {
      if (ms == null || ms < 0) return '—'
      if (ms < 60000) return Math.max(1, Math.round(ms / 1000)) + 's'
      if (ms < 3600000) return Math.round(ms / 60000) + 'm'
      if (ms < 86400000) {
        const h = Math.floor(ms / 3600000)
        const m = Math.round((ms % 3600000) / 60000)
        return m > 0 ? h + 'h ' + m + 'm' : h + 'h'
      }
      const d = Math.floor(ms / 86400000)
      const h = Math.round((ms % 86400000) / 3600000)
      return h > 0 ? d + 'd ' + h + 'h' : d + 'd'
    }

    function formatDateTime(iso) {
      if (!iso) return '—'
      const d = new Date(iso)
      const now = new Date()
      const diffMs = now - d
      const diffMin = Math.floor(diffMs / 60000)
      if (diffMin < 1) return 'just now'
      if (diffMin < 60) return diffMin + 'm ago'
      const diffH = Math.floor(diffMin / 60)
      if (diffH < 24) return diffH + 'h ago'
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
    }

    function formatRelativeTime(iso) {
      if (!iso) return ''
      const d = new Date(iso)
      const diff = Date.now() - d.getTime()
      const sec = Math.floor(diff / 1000)
      if (sec < 60) return sec + 's ago'
      return formatDateTime(iso)
    }

    /** 模型图标匹配逻辑（忽略大小写，长名优先） */
    const MODEL_ICON_BASE = [
      'claudecodeinternal', 'codexinternal', 'codebuddy', 'geminicli',
      'claude', 'cursor', 'deepseek', 'doubao', 'gemini', 'gemma',
      'glm', 'gpt', 'grok', 'hunyuan', 'hy', 'imate', 'kimi', 'knot', 'longcat',
      'minimax', 'qwen', 'seed', 'tapd', 'with', 'yuanbao', 'claw', 'echo', 'gongfeng'
    ];
    const MODEL_ICON_NAMES = MODEL_ICON_BASE.slice().sort((a, b) => b.length - a.length);
    const MODEL_ICON_EXT = {}
    MODEL_ICON_BASE.forEach((name) => {
      MODEL_ICON_EXT[name] = name === 'knot' || name === 'cursor' ? 'png' : 'svg'
    })
    MODEL_ICON_EXT.unknown = 'svg'

    function normalizeModelKey(name) {
      return String(name || '').trim().toLowerCase()
    }

    function stripModelName(name) {
      return normalizeModelKey(name).replace(/[^a-z0-9]/g, '')
    }

    function modelIconFile(icon) {
      const ext = MODEL_ICON_EXT[icon] || 'svg'
      return '/model-icons/' + icon + '.' + ext
    }

    function matchIconFromStripped(stripped) {
      if (!stripped) return null
      const key = stripped.toLowerCase()
      for (const icon of MODEL_ICON_NAMES) {
        const iconKey = icon.toLowerCase()
        if (key.includes(iconKey)) return icon
      }
      if (key.length >= 3) {
        for (const icon of MODEL_ICON_NAMES) {
          const iconKey = icon.toLowerCase()
          if (iconKey.includes(key)) return icon
        }
      }
      let best = null
      let bestLen = 0
      for (const icon of MODEL_ICON_NAMES) {
        const iconKey = icon.toLowerCase()
        let prefixLen = 0
        const minLen = Math.min(key.length, iconKey.length)
        for (let i = 0; i < minLen; i++) {
          if (key[i] !== iconKey[i]) break
          prefixLen++
        }
        if (prefixLen >= 3 && prefixLen > bestLen) {
          bestLen = prefixLen
          best = icon
        }
      }
      return best
    }

    function resolveModelIconUrl(modelName, providerName) {
      const keys = []
      const modelKey = stripModelName(modelName)
      const providerKey = stripModelName(providerName)
      if (modelKey) keys.push(modelKey)
      if (providerKey) keys.push(providerKey)
      if (modelKey && providerKey) keys.push(providerKey + modelKey, modelKey + providerKey)
      for (const stripped of keys) {
        const icon = matchIconFromStripped(stripped)
        if (icon) return modelIconFile(icon)
      }
      return modelIconFile('unknown')
    }

    /** 将消息内容渲染为可读文本，兼容历史 JSON 脏数据 */
    function formatMessageContent(content) {
      if (content == null) return ''
      if (typeof content !== 'string') return String(content)
      const trimmed = content.trim()
      if (!trimmed) return ''
      if (!trimmed.startsWith('{') && !trimmed.startsWith('[')) return trimmed
      try {
        const parsed = JSON.parse(trimmed)
        if (typeof parsed === 'string') return parsed
        if (parsed.summary?.body) return parsed.summary.body
        if (parsed.summary?.title) return parsed.summary.title
        if (typeof parsed.text === 'string') return parsed.text
        if (typeof parsed.prompt === 'string') return parsed.prompt
        if (Array.isArray(parsed)) {
          return parsed
            .filter(p => p && p.type === 'text' && p.text)
            .map(p => p.text)
            .join('\n')
            .trim() || trimmed
        }
        return trimmed
      } catch {
        return trimmed
      }
    }

    /** 过滤 OpenCode 元数据 JSON 等垃圾消息 */
    function isGarbageMessage(content) {
      if (content == null) return true
      const trimmed = String(content).trim()
      if (!trimmed) return true
      if (!trimmed.startsWith('{')) return false
      try {
        const p = JSON.parse(trimmed)
        if (p.role && p.sessionID && p.agent && !p.summary?.body && !p.summary?.title) return true
      } catch {}
      return false
    }

    /** 解析 session metadata JSON */
    function parseSessionMetadata(raw) {
      if (!raw) return {}
      if (typeof raw === 'object') return raw
      try { return JSON.parse(raw) } catch { return {} }
    }

  const FORK_TITLE_RE = /\(fork\s*#\d+\)/i

  /** OpenCode fork 会话：title 含 (fork #N) 或 API 返回 is_fork */
  function isForkSession(session) {
    if (!session) return false
    if (session.is_fork) return true
    return FORK_TITLE_RE.test(session.title || session.summary || '')
  }

  function forkParentSessionId(session) {
    if (!session) return null
    return session.fork_parent_session_id || null
  }

  /** fork 会话仅展示 fork 创建后的 event */
  function isEventAfterFork(session, createdAt) {
    if (!isForkSession(session) || !session.started_at || !createdAt) return true
    return String(createdAt) >= String(session.started_at)
  }

  /** fork 调用链顶部：来源会话 + 父会话首条消息 */
  function buildForkTracePrelude(detail) {
    if (!detail?.forkParent) return []
    const parent = detail.forkParent
    const parentId = parent.id
    const parentTitle = (parent.title && String(parent.title).trim()) || parent.summary || parentId
    const items = [{
      key: 'fork-from-' + parentId,
      kind: 'fork-from',
      role: 'fork-from',
      summary: 'Fork from · ' + parentTitle,
      fullText: '来源会话：' + parentTitle + '\n点击跳转到来源会话调用链。',
      parentSessionId: parentId,
      created_at: parent.started_at || parent.last_activity_at || '',
      depth: 0,
    }]
    const msg = detail.forkParentFirstMessage
    if (msg && !isGarbageMessage(msg.content)) {
      const text = formatMessageContent(msg.content)
      if (text) {
        items.push({
          key: 'fork-origin-msg-' + msg.id,
          kind: 'message',
          role: msg.role || 'user',
          summary: text.length > 120 ? text.slice(0, 120) + '…' : text,
          fullText: text,
          model: msg.model,
          created_at: msg.created_at || parent.started_at || '',
          depth: 0,
          forkOrigin: true,
        })
      }
    }
    return items
  }

    /** subagent 行展示文案（含 agent / model） */
    function formatSubagentHead(child) {
      const meta = parseSessionMetadata(child.metadata)
      const parts = []
      if (meta.opencode_agent) parts.push(meta.opencode_agent)
      if (child.model) parts.push(child.model)
      else if (child.provider) parts.push(child.provider)
      return parts.join(' · ')
    }

    function formatSubagentLabel(child) {
      const title = (child.title && String(child.title).trim()) || child.summary
      const head = formatSubagentHead(child)
      if (title && title !== child.id) {
        const short = title.length > 72 ? title.slice(0, 72) + '…' : title
        return head ? head + ' · ' + short : short
      }
      return head || 'Subagent'
    }

    function buildSubagentDetail(child) {
      const meta = parseSessionMetadata(child.metadata)
      const lines = []
      if (meta.opencode_agent) lines.push('Agent: ' + meta.opencode_agent)
      if (child.model) {
        lines.push('Model: ' + child.model + (child.provider ? ' (' + child.provider + ')' : ''))
      } else if (child.provider) {
        lines.push('Provider: ' + child.provider)
      }
      const title = (child.title && String(child.title).trim()) || child.summary
      if (title && title !== child.id) lines.push('Task: ' + title)
      lines.push('Tokens: ' + formatTokens(child.total_tokens))
      lines.push('Cost: ' + formatCost(child.total_cost_cny ?? 0))
      if (child.duration_ms != null) lines.push('Duration: ' + formatSessionDuration(child.duration_ms))
      lines.push('Session: ' + child.id)
      return lines.join('\n')
    }

    function summarizeTurn(turn) {
      const parts = [turn.model || 'turn']
      if (turn.error) parts.push('error')
      else if (turn.finish_reason) parts.push(turn.finish_reason)
      return parts.join(' · ')
    }

    function buildTurnDetail(turn) {
      const lines = [
        'Model: ' + (turn.model || '—') + ' (' + (turn.provider || '—') + ')',
        'Tokens: in ' + formatTokens(turn.input_tokens) +
          ' · out ' + formatTokens(turn.output_tokens) +
          (turn.cache_read_tokens ? ' · cache读 ' + formatTokens(turn.cache_read_tokens) : '') +
          (turn.reasoning_tokens ? ' · reason ' + formatTokens(turn.reasoning_tokens) : ''),
        'Duration: ' + formatDuration(turn.duration_ms),
        'Cost: ' + formatCost(turn.cost_cny ?? 0),
      ]
      if (turn.finish_reason) lines.push('Finish: ' + turn.finish_reason)
      if (turn.error) lines.push('Error: ' + turn.error)
      return lines.join('\n')
    }

  /** 合并 messages / turns / tools / subagent 为时间线 */
    function buildTraceItems(detail, depth, sessionCtx) {
      if (!detail) return []
      depth = depth || 0
      const items = []
      const messages = detail.messages || []
      const turns = detail.turns || []
      const tools = detail.tools || []
      const children = detail.children || []

      for (const msg of messages) {
        if (sessionCtx && !isEventAfterFork(sessionCtx, msg.created_at)) continue
        if (isGarbageMessage(msg.content)) continue
        const text = formatMessageContent(msg.content)
        if (!text) continue
        items.push({
          key: 'msg-' + msg.id,
          kind: 'message',
          role: msg.role || 'unknown',
          summary: text.length > 120 ? text.slice(0, 120) + '…' : text,
          fullText: text,
          model: msg.model,
          created_at: msg.created_at,
          depth,
        })
      }

      for (const turn of turns) {
        if (sessionCtx && !isEventAfterFork(sessionCtx, turn.created_at)) continue
        // cursor-usage-* 为历史账单行，不参与调用链时间线
        if (turn.id && String(turn.id).indexOf('cursor-usage-') === 0) continue
        items.push({
          key: 'turn-' + turn.id,
          kind: 'turn',
          role: turn.error ? 'turn-fail' : 'turn',
          summary: summarizeTurn(turn),
          fullText: buildTurnDetail(turn),
          model: turn.model,
          tokens: turn.total_tokens,
          cost_cny: turn.cost_cny,
          created_at: turn.created_at,
          depth,
        })
      }

      for (const tool of tools) {
        if (sessionCtx && !isEventAfterFork(sessionCtx, tool.created_at)) continue
        const title = tool.output_title ? ': ' + tool.output_title : ''
        items.push({
          key: 'tool-' + tool.call_id,
          kind: 'tool',
          role: 'tool',
          summary: (tool.tool_name || 'tool') + title,
          fullText: tool.output_text || tool.output_title || '',
          created_at: tool.created_at,
          depth,
        })
      }

      for (const child of children) {
        items.push({
          key: 'subagent-' + child.id,
          kind: 'subagent',
          role: 'subagent',
          summary: formatSubagentLabel(child),
          fullText: buildSubagentDetail(child),
          model: child.model,
          provider: child.provider,
          childSessionId: child.id,
          childSession: child,
          tokens: child.total_tokens,
          cost_cny: child.total_cost_cny,
          created_at: child.started_at,
          depth,
        })
      }

      // 同时间戳时：user → turn（计量）→ assistant → tool → 其它，避免「回复压在推理上面」
      const tieBreak = (it) => {
        if (it.kind === 'fork-from') return 0
        if (it.kind === 'message' && (it.role === 'user' || it.role === 'system')) return 1
        if (it.kind === 'turn') return 2
        if (it.kind === 'message' && it.role === 'assistant') return 3
        if (it.kind === 'message') return 4
        if (it.kind === 'tool') return 5
        if (it.kind === 'subagent') return 6
        return 7
      }
      items.sort((a, b) => {
        const ta = new Date(a.created_at).getTime()
        const tb = new Date(b.created_at).getTime()
        if (ta !== tb) return ta - tb
        const oa = tieBreak(a)
        const ob = tieBreak(b)
        if (oa !== ob) return oa - ob
        return String(a.key || '').localeCompare(String(b.key || ''))
      })
      items.forEach((it, i) => { it.seq = i + 1 })
      return items
    }

    /** 展开 subagent 后扁平化 trace（含嵌套子项） */
    function flattenTraceItems(rootSessionId, items, detail, sessionCtx) {
      const flat = []
      const expanded = expandedSubagents.value
      const childDetails = (detail && detail.childDetails) || {}
      for (const it of items) {
        flat.push(it)
        if (it.kind === 'subagent' && expanded[it.childSessionId]) {
          const childDetail = childDetails[it.childSessionId]
          if (childDetail) {
            const nested = buildTraceItems(childDetail, (it.depth || 0) + 1, null)
            flat.push(...nested.map((n) => ({ ...n, nested: true })))
          }
        }
      }
      return flat
    }

    function mergeForkTraceItems(session, detail) {
      const prelude = buildForkTracePrelude(detail)
      const body = flattenTraceItems(
        session?.id,
        buildTraceItems(detail, 0, isForkSession(session) ? session : null),
        detail,
        session,
      )
      const merged = [...prelude, ...body]
      merged.forEach((it, i) => { it.seq = i + 1 })
      return merged
    }

    // ─── Data loading ───
    async function fetchCursorStatus() {
      try {
        const res = await apiFetch('/v1/cursor/status')
        if (res.ok) {
          cursorStatus.value = await res.json()
        }
      } catch {
        // silent
      }
    }

    async function saveCursorToken() {
      cursorError.value = ''
      cursorMessage.value = ''
      const token = cursorTokenInput.value.trim()
      if (!token) {
        cursorError.value = '请粘贴 WorkosCursorSessionToken'
        return
      }
      cursorSaving.value = true
      try {
        const res = await apiFetch('/v1/cursor/cookies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionToken: token, source: 'dashboard' }),
        })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) {
          cursorError.value = data.error || '保存失败'
          return
        }
        cursorStatus.value = data.status || cursorStatus.value
        cursorTokenInput.value = ''
        cursorMessage.value = '已保存，后台将自动拉取 Cursor 账单并对账到会话'
        await fetchData(true)
      } catch {
        cursorError.value = '保存失败，请稍后重试'
      } finally {
        cursorSaving.value = false
      }
    }

    async function syncCursorNow() {
      cursorError.value = ''
      cursorMessage.value = ''
      cursorSyncing.value = true
      try {
        const res = await apiFetch('/v1/cursor/sync', { method: 'POST' })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) {
          cursorError.value = data.error || '同步失败'
          return
        }
        cursorStatus.value = data.status || cursorStatus.value
        cursorMessage.value = '同步完成'
        await fetchData(true)
      } catch {
        cursorError.value = '同步失败，请稍后重试'
      } finally {
        cursorSyncing.value = false
      }
    }

    async function clearCursorToken() {
      cursorError.value = ''
      cursorMessage.value = ''
      try {
        const res = await apiFetch('/v1/cursor/cookies', { method: 'DELETE' })
        if (res.ok) {
          const data = await res.json()
          cursorStatus.value = data.status || null
          cursorMessage.value = '已清除 Cursor Session Token'
        }
      } catch {
        cursorError.value = '清除失败'
      }
    }

    async function fetchData(showRefreshSpinner = false) {
      if (showRefreshSpinner) {
        refreshing.value = true
      } else {
        loading.value = true
      }
      try {
        const qs = statsQueryString()
        const [summaryRes, modelRes, agentRes, dailyRes, sessionsRes] = await Promise.all([
          apiFetch('/v1/stats/summary' + qs).then(r => r.json()).catch(() => null),
          apiFetch('/v1/stats/by-model' + qs).then(r => r.json()).catch(() => []),
          apiFetch('/v1/stats/by-agent' + qs).then(r => r.json()).catch(() => []),
          apiFetch('/v1/stats/daily' + qs).then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions?limit=50').then(r => r.json()).catch(() => []),
        ])
        batch(() => {
          summary.value = summaryRes
          byModel.value = modelRes
          byAgent.value = agentRes
          dailyStats.value = dailyRes
          sessions.value = sessionsRes
          loading.value = false
          refreshing.value = false
          lastRefreshed.value = new Date().toISOString()
        })
      } catch (e) {
        batch(() => {
          loading.value = false
          refreshing.value = false
        })
      }
    }

    async function fetchChildDetail(rootSessionId, childSessionId) {
      const root = sessionDetails.value[rootSessionId]
      if (!root) return
      if (root.childDetails && root.childDetails[childSessionId]) return
      try {
        const [msgs, turns, tools, children] = await Promise.all([
          apiFetch('/v1/sessions/' + childSessionId + '/messages').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + childSessionId + '/turns').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + childSessionId + '/tool-calls').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + childSessionId + '/children').then(r => r.json()).catch(() => []),
        ])
        const prev = sessionDetails.value[rootSessionId] || {}
        batch(() => {
          sessionDetails.value = {
            ...sessionDetails.value,
            [rootSessionId]: {
              ...prev,
              childDetails: {
                ...(prev.childDetails || {}),
                [childSessionId]: { messages: msgs, turns, tools, children },
              },
            },
          }
        })
      } catch {
        // silent
      }
    }

    async function toggleSubagent(rootSessionId, childSessionId) {
      const expanded = { ...expandedSubagents.value }
      const next = !expanded[childSessionId]
      expanded[childSessionId] = next
      expandedSubagents.value = expanded
      if (next) await fetchChildDetail(rootSessionId, childSessionId)
    }

    async function fetchSessionDetail(sessionId) {
      const ensureSelection = (detail, session) => {
        const items = mergeForkTraceItems(session, detail)
        if (items.length) selectedTraceKey.value = items[0].key
      }
      const cached = sessionDetails.value[sessionId]
      const cachedSession = sessions.value.find(s => s.id === sessionId) || cached?.session || null
      if (cached && (!isForkSession(cachedSession) || cached.forkParent)) {
        ensureSelection(cached, cachedSession)
        return
      }
      try {
        const sessionRes = await apiFetch('/v1/sessions/' + sessionId).then(r => r.json()).catch(() => null)
        const forkParentId = sessionRes?.fork_parent_session_id || null
        const fetches = [
          apiFetch('/v1/sessions/' + sessionId + '/messages').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + sessionId + '/turns').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + sessionId + '/tool-calls').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + sessionId + '/children').then(r => r.json()).catch(() => []),
        ]
        if (forkParentId) {
          fetches.push(apiFetch('/v1/sessions/' + forkParentId).then(r => r.json()).catch(() => null))
          fetches.push(apiFetch('/v1/sessions/' + forkParentId + '/messages?limit=1').then(r => r.json()).catch(() => []))
        }
        const results = await Promise.all(fetches)
        const msgs = results[0]
        const turns = results[1]
        const tools = results[2]
        const children = results[3]
        const forkParent = forkParentId ? results[4] : null
        const forkParentMsgs = forkParentId ? results[5] : null
        const detail = {
          messages: msgs,
          turns,
          tools,
          children,
          childDetails: {},
          session: sessionRes,
          forkParent,
          forkParentFirstMessage: Array.isArray(forkParentMsgs) ? forkParentMsgs[0] : null,
        }
        batch(() => {
          sessionDetails.value = { ...sessionDetails.value, [sessionId]: detail }
        })
        ensureSelection(detail, sessionRes)
      } catch {
        // silent
      }
    }

      const updated = computed(() => formatDateTime(session.value.last_activity_at || session.value.started_at))
      const duration = computed(() => formatSessionDuration(session.value.duration_ms))
      const tokens = computed(() => formatTokens(session.value.total_tokens))
      const cost = computed(() => formatCost(session.value.total_cost_cny))

      return (

    // ─── Session Detail（密集 trace 视图） ───
    const SessionDetailView = component(({ sessionId }) => {
      const detail = computed(() => sessionDetails.value[sessionId] || null)
      const session = computed(() => {
        return sessions.value.find(s => s.id === sessionId) || detail.value?.session || null
      })
      const forkParentId = computed(() => forkParentSessionId(session.value))
      const forkParent = computed(() => {
        const id = forkParentId.value
        if (!id) return null
        return detail.value?.forkParent
          || sessions.value.find(s => s.id === id)
          || { id }
      })
      const forkParentLabel = computed(() => {
        const p = forkParent.value
        if (!p) return ''
        return (p.title && String(p.title).trim()) || p.summary || p.id?.slice(0, 12) || ''
      })
      const parentSession = computed(() => session.value?.parent_session_id
        ? (sessions.value.find(s => s.id === session.value.parent_session_id) || { id: session.value.parent_session_id })
        : null)
      const parentLabel = computed(() => {
        const p = parentSession.value
        if (!p) return ''
        return p.title || p.summary || p.id?.slice(0, 12) || ''
      })
      const traceItems = computed(() => mergeForkTraceItems(session.value, detail.value))
      const summaryText = computed(() => session.value?.summary || session.value?.title || sessionId)
      const duration = computed(() => formatSessionDuration(session.value?.duration_ms))
      const selected = computed(() => {
        const items = traceItems.value
        const key = selectedTraceKey.value
        return items.find(it => it.key === key) || items[0] || null
      })

      const detailLabel = computed(() => {
        const it = selected.value
        if (!it) return ''
        if (it.kind === 'turn') return 'LLM Turn' + (it.model ? ' · ' + it.model : '')
        if (it.kind === 'tool') return 'Tool · ' + (it.summary || '')
        if (it.kind === 'subagent') {
          const model = it.model || it.childSession?.model
          const provider = it.provider || it.childSession?.provider
          return 'Subagent' + (model ? ' · ' + model : '') + (provider ? ' (' + provider + ')' : '')
        }
        if (it.kind === 'fork-from') return 'Fork 来源'
        return (it.role || '') + (it.model ? ' · ' + it.model : '')
      })

      return (
        <div className="fade-up">
          <button className="trace-back" onClick={() => navigate('sessions')}>

          </button>
          <div className="panel-card" style={{ padding: 0, overflow: 'hidden' }}>

              <span className="trace-meta-item">
                <span className="trace-meta-label">Summary</span>
                <span className="trace-meta-val trace-meta-val--summary" title={summaryText}>{summaryText}</span>

              {session.value?.model ? (
                <span className="trace-meta-item">
                  <span className="trace-meta-label">Model</span>
                  <span className="trace-meta-val">{session.value.model}</span>
                </span>
              ) : null}
              {session.value?.agent ? (
                <span className="trace-meta-item">
                  <span className="trace-meta-label">Agent</span>
                  <span className="trace-meta-val">{session.value.agent}</span>
                </span>
              ) : null}
              <span className="trace-meta-item">
                <span className="trace-meta-label">Started</span>
                <span className="trace-meta-val">{formatDateTime(session.value?.started_at)}</span>
              </span>
              <span className="trace-meta-item">
                <span className="trace-meta-label">Duration</span>
                <span className="trace-meta-val">{duration}</span>
              </span>
              <span className="trace-meta-item">
                <span className="trace-meta-label">Tokens</span>
                <span className="trace-meta-val">{formatTokens(session.value?.total_tokens)}</span>
              </span>
              <span className="trace-meta-item">
                <span className="trace-meta-label">Cost</span>
                <span className="trace-meta-val">{formatCost(session.value?.total_cost_cny)}</span>
              </span>
              {forkParentId.value
                ? <span className="trace-meta-item">
                    <span className="trace-meta-label">Fork from</span>
                    <span
                      className="trace-meta-val"
                      style={{ color: 'var(--brand-blue)', cursor: 'pointer' }}
                      onClick={() => openSession(forkParentId.value)}
                      title={forkParentId.value}
                    >{forkParentLabel}</span>
                  </span>
                : null}
              {session.value?.parent_session_id
                ? <span className="trace-meta-item">
                    <span className="trace-meta-label">Subagent of</span>
                    <span
                      className="trace-meta-val"
                      style={{ color: 'var(--brand-blue)', cursor: 'pointer' }}
                      onClick={() => openSession(session.value.parent_session_id)}
                      title={session.value.parent_session_id}
                    >{parentLabel}</span>
                  </span>
                : null}
            </div>
            {traceItems.value.length === 0
              ? <div className="empty-state" style={{ padding: '32px 20px' }}><p>暂无调用记录</p></div>
              : <div className="trace-shell">
                  <div className="trace-panel">
                    <div className="trace-panel-head">
                      调用链
                      <span style={{ float: 'right', fontWeight: 400, textTransform: 'none', letterSpacing: 0, color: 'var(--text-muted)' }}>
                        <span className="trace-role-dot trace-role-dot--user" style={{ display: 'inline-block', verticalAlign: 'middle', marginRight: 4 }} />用户
                        <span className="trace-role-dot trace-role-dot--assistant" style={{ display: 'inline-block', verticalAlign: 'middle', margin: '0 4px 0 10px' }} />助手
                        <span className="trace-role-dot trace-role-dot--turn" style={{ display: 'inline-block', verticalAlign: 'middle', margin: '0 4px 0 10px' }} />Turn
                        <span className="trace-role-dot trace-role-dot--subagent" style={{ display: 'inline-block', verticalAlign: 'middle', margin: '0 4px 0 10px' }} />Subagent
                      </span>
                    </div>
                    <div className="trace-list">

                        <div

                          className={'trace-row' +

                            (it.nested ? ' trace-row--nested' : '') +
                            (it.kind === 'subagent' ? ' trace-row--subagent' : '') +
                            (it.kind === 'fork-from' ? ' trace-row--fork-from' : '')}
                          style={{ paddingLeft: (8 + (it.depth || 0) * 14) + 'px' }}

                            if (it.kind === 'fork-from' && it.parentSessionId) {

                            }
                            selectedTraceKey.value = it.key
                          }}
                        >
                          <span className="trace-seq">{it.seq || ''}</span>

                              className="trace-expand-btn"

                            </button>
                          ) : (
                            <span className={'trace-role-dot trace-role-dot--' + it.role} />

                          <span className="trace-meta">{it.tokens != null ? formatTokens(it.tokens) : ''}</span>

                        </div>

                    </div>
                  </div>
                  <div className="trace-panel">
                    <div className="trace-panel-head">详情</div>
                    {selected.value ? (

            <br />

          </div>
        </div>
      </div>
    ))

    // ─── Loading Screen ───
    const LoadingScreen = component(() => (
      <div className="flex items-center justify-center min-h-screen app-shell">

          <div className="spinner-lg mx-auto" />
          <p className="gradient-text" style={{ fontSize: '22px', fontWeight: 700 }}>Runmark</p>
          <p style={{ fontSize: '13px', color: 'var(--text-muted)' }}>Loading telemetry data…</p>
        </div>
      </div>
    ))

    const CursorCookieDialog = component(() => {

              </DialogDescription>
            </DialogHeader>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.6 }}>

                <ol style={{ margin: '8px 0 0', paddingLeft: '18px' }}>

                  <li>DevTools → Application → Cookies → cursor.com</li>
                  <li>复制 <code style={{ fontSize: '12px' }}>WorkosCursorSessionToken</code> 的值</li>
                </ol>
              </div>
              {!ready ? (
                <p style={{ color: 'var(--accent-orange)' }}>服务端未配置 AGENT_TRACKER_CURSOR_CRYPTO_KEY，无法加密存储 Token。请联系管理员在 .env 中配置。</p>
              ) : null}
              <div>
                <Label htmlFor="cursor-token">WorkosCursorSessionToken</Label>
                <Textarea
                  id="cursor-token"
                  className="cursor-token-input"
                  placeholder="粘贴 Session Token（敏感信息，仅保存在本服务加密数据库）"
                  value={cursorTokenInput.value}
                  onInput={(e) => { cursorTokenInput.value = e.target.value }}
                  rows={3}
                  style={{ marginTop: '6px', fontFamily: 'ui-monospace, monospace', fontSize: '12px' }}
                />
              </div>
              <div style={{ fontSize: '12px' }}>
                <div>状态：{linked ? '已配置 Token' : '未配置'}{st.authExpired ? ' · 已过期，请重新粘贴' : ''}</div>
                {st.lastSuccessAt ? <div>上次同步：{formatDateTime(st.lastSuccessAt)}</div> : null}
                {st.pendingQueue > 0 ? <div>待对账会话：{st.pendingQueue}</div> : null}
                {st.lastError ? <div style={{ color: 'var(--accent-orange)' }}>{st.lastError}</div> : null}
                {cursorMessage.value ? <div style={{ color: 'var(--accent-green)' }}>{cursorMessage.value}</div> : null}
                {cursorError.value ? <div style={{ color: '#f87171' }}>{cursorError.value}</div> : null}

              <Button onClick={() => saveCursorToken()} disabled={!ready || cursorSaving.value || cursorSyncing.value}>

              </Button>
              <DialogClose asChild>
                <Button variant="ghost">关闭</Button>
              </DialogClose>
            </DialogFooter>
          </DialogContent>
        </Dialog>

        return <LoadingScreen />

              <div>

                  <div className="flex items-center justify-between" style={{ marginBottom: '14px' }}>
                    <SectionTitle title="模型统计" subtitle="Token 用量与费用明细" />
                    <span className="count-chip">{byModel.value.length + ' models'}</span>
                  </div>
                  {byModel.value.length === 0
                    ? <EmptyState message="暂无模型数据" />
                    : <>
                        <div className="list-header">
                          <div style={{ flex: 2 }}>Model</div>
                          <div style={{ flex: 1, textAlign: 'right' }}>Turns</div>
                          <div style={{ flex: 1, textAlign: 'right' }}>In</div>
                          <div style={{ flex: 1, textAlign: 'right' }}>Out</div>
                          <div style={{ flex: 1, textAlign: 'right' }}>Total</div>
                          <div style={{ flex: 1, textAlign: 'right' }}>Cost</div>
                          <div style={{ flex: 1, textAlign: 'right' }}>Avg</div>
                        </div>
                        {byModel.value.map((m, i) => (
                          <ModelRow key={i} item={signal(m)} />
                        ))}
                      </>
                  }
                </div>
              ) : null}

              {/* ── Sessions Tab ── */}
              {activeTab.value === 'sessions' && routeSessionId.value ? (
                <SessionDetailView sessionId={routeSessionId.value} />
              ) : null}

              {activeTab.value === 'sessions' && !routeSessionId.value ? (
                <div className="panel-card fade-up">
                  <div className="flex items-center justify-between" style={{ marginBottom: '14px' }}>
                    <SectionTitle title="最近会话" subtitle="点击行查看对话记录" />
                    <span className="count-chip">{sessions.value.length + ' sessions'}</span>
                  </div>
                  {sessions.value.length === 0
                    ? <EmptyState message="暂无会话数据" />
                    : <>
                        <div className="list-header">
                          <div className="session-summary-col">Summary</div>
                          <div style={{ flex: 0.7 }}>Agent</div>
                          <div style={{ flex: 1 }}>Model</div>
                          <div style={{ flex: 0.8 }}>Updated</div>
                          <div style={{ flex: 0.7 }}>Duration</div>
                          <div style={{ flex: 0.7, textAlign: 'right' }}>Tokens</div>
                          <div style={{ flex: 0.7, textAlign: 'right' }}>Cost</div>
                        </div>
                        {sessions.value.map((s, i) => (
                          <SessionRow key={s.id || i} session={signal(s)} />
                        ))}
                      </>
                  }
                </div>
              ) : null}
            </main>
          </div>
        </div>
      )
    })

    const Root = component(() => {
      if (authChecking.value) return <LoadingScreen />
      if (!authenticated.value) return <LoginScreen />
      return <App />
    })

    // ─── Mount ───
    await initEficy()
    render(Root, document.getElementById('app'))
  </script>

  <script type="module" src="https://unpkg.com/@eficy/browser@1.2.4/dist/standalone.js"></script>
</body>
</html>
