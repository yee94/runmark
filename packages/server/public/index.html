<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Runmark</title>
  <link rel="stylesheet" href="https://unpkg.com/@eficy/shadcn-ui@1.1.3/dist/index.css" />
  <link rel="stylesheet" href="./style.css?v=memory-evidence-20261029" />
</head>
<body>
  <div class="ambient">
    <div class="glow-blue"></div>
    <div class="glow-green"></div>
    <div class="glow-orange"></div>
  </div>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "shadcn": "https://unpkg.com/@eficy/shadcn-ui@1.1.3/dist/index.js",
      "marked": "https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.esm.min.js",
      "moment": "https://cdn.jsdelivr.net/npm/moment@2.30.1/+esm",
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.4.13/+esm"
    }
  }
  </script>

  <script type="module" src="https://unpkg.com/@eficy/browser@1.2.4/dist/standalone.js"></script>
  <script type="text/eficy">
    import { initEficy, render, signal, computed, effect, component, bind, peek, batch, loadModule } from 'eficy'
    import * as shadcnUi from 'shadcn'
    import { marked } from 'marked'
    import DOMPurify from 'dompurify'

    // ─── Destructure shadcn components ───
    const {
      Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter,
      Table, TableHeader, TableBody, TableHead, TableRow, TableCell,
      Tabs, TabsList, TabsTrigger, TabsContent,
      Button, Badge, Separator, ScrollArea,
      Tooltip, TooltipProvider, TooltipTrigger, TooltipContent,
      Dialog, DialogClose, DialogContent, DialogDescription, DialogFooter, DialogHeader, DialogTitle,
      Input, Textarea, Label,
      Calendar, Popover, PopoverTrigger, PopoverContent,
    } = shadcnUi
    const { CalendarDays, Brain } = shadcnUi.Lucide

    // ─── Signals ───
    const summary = signal(null)
    const byModel = signal([])
    const byAgent = signal([])
    const dailyStats = signal([])
    const sessions = signal([])
    const sessionLimit = 50
    const sessionOffset = signal(0)
    const sessionHasMore = signal(false)
    const sessionQuery = signal('')
    const sessionSearchInput = signal('')
    const sessionsLoading = signal(false)
    const sessionAiSearchLoading = signal(false)
    const sessionAiResultsMode = signal(false)
    const sessionAiResultsQuery = signal('')
    const sessionAiResultIds = signal([])
    const sessionAiMatchedCount = signal(0)
    let sessionAiSearchVersion = 0
    const loading = signal(true)
    const refreshing = signal(false)
    const activeTab = signal('summary')
    const routeSessionId = signal(null)
    const routeAgentRunId = signal(null)
    const selectedTraceKey = signal(null)
    const traceAutoFocusKey = signal(null)
    const traceTypes = signal([])
    const routeTraceChild = signal(null)
    const traceDeepLinkFocus = signal(false)
    const sessionDetails = signal({})
    const expandedSubagents = signal({})
    const shareMode = signal(false)
    const routeShareToken = signal(null)
    const publicShareLoading = signal(false)
    const publicShareError = signal('')
    const publicShareErrorTitle = signal('')
    const publicShareExpiresAt = signal(null)
    const publicShareAgentPrompt = signal('')
    const publicShareSession = signal(null)
    const publicShareScope = signal({ types: [], node: null, child: null })
    const publicShareTraceItems = signal([])
    const publicShareTraceLoading = signal(false)
    const publicShareTraceLoadingMore = signal(false)
    const publicShareTraceError = signal('')
    const publicShareTraceNextOffset = signal(null)
    const lastRefreshed = signal(null)
    const statsRange = signal('month')
    function localDateString(date) {
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0')
    }
    function beijingCalendarParts(date = new Date()) {
      const shifted = new Date(date.getTime() + 8 * 60 * 60 * 1000)
      return { year: shifted.getUTCFullYear(), month: shifted.getUTCMonth(), day: shifted.getUTCDate() }
    }
    function beijingYmdFromParts(year, month, day) {
      return year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0')
    }
    const _beijingNow = beijingCalendarParts()
    const customFrom = signal(beijingYmdFromParts(_beijingNow.year, _beijingNow.month, 1))
    const customTo = signal(beijingYmdFromParts(_beijingNow.year, _beijingNow.month, _beijingNow.day))
    const customRangeOpen = signal(false)
    const customRangeDraft = signal(undefined)
    const customRangeAnchor = signal(null)
    let appliedCustomBounds = null
    const modelSort = signal('cost')
    const authenticated = signal(false)
    const authChecking = signal(true)
    const authError = signal('')
    const loginPassword = signal('')
    const loginSubmitting = signal(false)
    const isPublicDashboard = signal(false)
    const cursorStatus = signal(null)
    const cursorDialogOpen = signal(false)
    const providerDialogOpen = signal(false)
    const cursorTokenInput = signal('')
    const cursorSaving = signal(false)
    const cursorSyncing = signal(false)
    const cursorError = signal('')
    const cursorMessage = signal('')
    const hoveredDailyRow = signal(null)
    const dailyChartMetric = signal('cost')
    const selectedMatterId = signal('matter-pi-plan')
    const selectedMatterTab = signal('summary')
    const selectedArchiveId = signal('archive-041')
    const selectedAgentId = signal('agent-matter-archive')
    const selectedAgentRunId = signal('run-20260708-1432')
    const selectedProviderId = signal('provider-openai-prod')
    const selectedHelpArticleId = signal('quickstart')

    /** 带 Cookie 的 API 请求（Dashboard 登录态） */
    function apiFetch(url, options) {
      return fetch(url, { credentials: 'include', ...options })
    }

    async function checkAuth() {
      authChecking.value = true
      try {
        const res = await apiFetch('/auth/session')
        const data = await res.json()
        isPublicDashboard.value = !!data.public
        authenticated.value = !!data.authenticated
        if (data.authenticated) {
          syncRouteFromHash()
          await Promise.all([fetchData(false), fetchCursorStatus()])
          startAutoRefresh()
          loadSystemUpdate()
        }
      } catch {
        authenticated.value = false
      } finally {
        authChecking.value = false
      }
    }

    async function login() {
      authError.value = ''
      loginSubmitting.value = true
      try {
        const res = await apiFetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: loginPassword.value }),
        })
        if (!res.ok) {
          authError.value = '密码错误。请使用当前服务（' + location.host + '）配置的访问密码，不是其他环境的密码'
          return
        }
        authenticated.value = true
        loginPassword.value = ''
        syncRouteFromHash()
        await Promise.all([fetchData(false), fetchCursorStatus()])
        startAutoRefresh()
        loadSystemUpdate()
      } catch {
        authError.value = '登录失败，请稍后重试'
      } finally {
        loginSubmitting.value = false
      }
    }

    async function logout() {
      try {
        await apiFetch('/auth/logout', { method: 'POST' })
      } catch {}
      if (refreshTimer) clearInterval(refreshTimer)
      batch(() => {
        authenticated.value = false
        loading.value = true
        summary.value = null
        byModel.value = []
        byAgent.value = []
        dailyStats.value = []
        sessions.value = []
        sessionOffset.value = 0
        sessionHasMore.value = false
        sessionQuery.value = ''
        sessionSearchInput.value = ''
        sessionsLoading.value = false
        sessionAiSearchVersion += 1
        sessionAiSearchLoading.value = false
        sessionAiResultsMode.value = false
        sessionAiResultsQuery.value = ''
        sessionAiResultIds.value = []
        sessionAiMatchedCount.value = 0
      })
    }

    const RANGE_OPTIONS = [
      { k: 'today', label: '今天' },
      { k: '24h', label: '过去 24 小时' },
      { k: '7d', label: '过去一周' },
      { k: 'month', label: '本月' },
      { k: 'last_month', label: '上个月' },
      { k: 'all', label: '全部' },
      { k: 'custom', label: '自定义' },
    ]

    const VALID_TABS = ['summary', 'models', 'sessions', 'agent-config', 'agent-runs', 'matters', 'memories', 'system-config', 'help']

    function statsQueryString() {
      const range = statsRange.value
      const params = new URLSearchParams({ range, sort: modelSort.value })
      // 预设范围由服务端按北京时间计算。自定义日期按所选日历日的北京时间全天传边界。
      if (range === 'custom' && appliedCustomBounds) {
        params.set('from', customFrom.value + 'T00:00:00.000+08:00')
        params.set('to', customTo.value + 'T23:59:59.999+08:00')
      }
      return '?' + params.toString()
    }

    function sessionsQueryString(offset = sessionOffset.value) {
      const params = new URLSearchParams()
      params.set('limit', String(sessionLimit))
      params.set('offset', String(Math.max(0, Number(offset) || 0)))
      const q = String(sessionQuery.value || '').trim()
      if (q) params.set('q', q)
      return '?' + params.toString()
    }

    function applySessionsResult(rows) {
      const list = Array.isArray(rows) ? rows : []
      sessions.value = list
      sessionHasMore.value = list.length >= sessionLimit
    }

    function restoreNormalSessionListMode() {
      sessionAiSearchVersion += 1
      sessionAiSearchLoading.value = false
      sessionAiResultsMode.value = false
      sessionAiResultsQuery.value = ''
      sessionAiResultIds.value = []
      sessionAiMatchedCount.value = 0
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms))
    }

    function parseSessionSearchOutput(data) {
      let output = data?.output_json ?? data?.output ?? data
      if (typeof output === 'string') {
        try {
          output = JSON.parse(output)
        } catch (err) {
          return null
        }
      }
      return output && Array.isArray(output.session_ids) ? output : null
    }

    async function fetchAiSessionRows(ids) {
      const rows = await Promise.all(ids.map(async (id) => {
        const res = await apiFetch('/v1/sessions/' + encodeURIComponent(id)).catch(() => null)
        if (!res?.ok) return null
        return res.json().catch(() => null)
      }))
      return rows.filter(Boolean)
    }

    async function showAiSessionSearchResults(output, query, searchVersion) {
      const ids = output.session_ids.map((id) => String(id)).filter(Boolean)
      const rows = await fetchAiSessionRows(ids)
      if (searchVersion !== sessionAiSearchVersion) return false
      if (ids.length && !rows.length) throw new Error('AI 搜索已完成，会话详情加载失败')
      sessionOffset.value = 0
      sessionHasMore.value = false
      sessionQuery.value = ''
      sessionAiResultIds.value = ids
      sessionAiMatchedCount.value = Number.isFinite(Number(output.matched_count)) ? Number(output.matched_count) : ids.length
      sessionAiResultsQuery.value = String(output.query || query)
      sessionAiResultsMode.value = true
      sessions.value = rows
      return true
    }

    async function pollAiSessionSearchJob(jobId, query, searchVersion) {
      for (let i = 0; i < 90; i++) {
        if (searchVersion !== sessionAiSearchVersion) return false
        const res = await apiFetch('/v1/agent-runs/' + encodeURIComponent(jobId)).catch(() => null)
        const run = res?.ok ? await res.json().catch(() => null) : null
        if (searchVersion !== sessionAiSearchVersion) return false
        if (run?.status === 'success') {
          const output = parseSessionSearchOutput(run)
          if (!output) throw new Error('AI 搜索结果格式异常')
          return showAiSessionSearchResults(output, query, searchVersion)
        }
        if (run?.status === 'failed') throw new Error(run.error || 'AI 搜索失败')
        await sleep(2000)
      }
      return false
    }

    async function fetchSessions(showSpinner = false) {
      if (sessionAiResultsMode.value) return
      if (showSpinner) sessionsLoading.value = true
      try {
        const rows = await apiFetch('/v1/sessions' + sessionsQueryString())
          .then((r) => r.json())
          .catch(() => [])
        if (sessionAiResultsMode.value) return
        batch(() => {
          applySessionsResult(rows)
          sessionsLoading.value = false
        })
      } catch {
        sessionsLoading.value = false
      }
    }

    function runSessionSearch() {
      restoreNormalSessionListMode()
      sessionQuery.value = String(sessionSearchInput.value || '').trim()
      sessionOffset.value = 0
      fetchSessions(true)
    }

    async function runAiSessionSearch() {
      const query = String(sessionSearchInput.value || '').trim()
      if (!query) return
      restoreNormalSessionListMode()
      const searchVersion = sessionAiSearchVersion
      sessionsLoading.value = false
      sessionAiSearchLoading.value = true
      try {
        const res = await apiFetch('/v1/sessions/agent-search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        })
        const data = await res.json().catch(() => ({}))
        if (searchVersion !== sessionAiSearchVersion) return
        if (!res.ok) throw new Error(data.error || data.summary || 'AI 搜索启动失败')
        if (res.status === 202) {
          if (!data.id) throw new Error('AI 搜索任务缺少任务 ID')
          await pollAiSessionSearchJob(data.id, query, searchVersion)
          return
        }
        const output = parseSessionSearchOutput(data)
        if (!output) throw new Error('AI 搜索结果格式异常')
        await showAiSessionSearchResults(output, query, searchVersion)
      } catch (err) {
        if (searchVersion === sessionAiSearchVersion) {
          sessions.value = []
          sessionHasMore.value = false
          sessionAiResultsMode.value = true
          sessionAiResultsQuery.value = query
          sessionAiMatchedCount.value = 0
          sessionAiResultIds.value = []
        }
      } finally {
        if (searchVersion === sessionAiSearchVersion) sessionAiSearchLoading.value = false
      }
    }

    function clearSessionSearch() {
      restoreNormalSessionListMode()
      sessionSearchInput.value = ''
      sessionQuery.value = ''
      sessionOffset.value = 0
      fetchSessions(true)
    }

    function prevSessionPage() {
      if (sessionAiResultsMode.value || sessionOffset.value <= 0 || sessionsLoading.value) return
      sessionOffset.value = Math.max(0, sessionOffset.value - sessionLimit)
      fetchSessions(true)
    }

    function nextSessionPage() {
      if (sessionAiResultsMode.value || !sessionHasMore.value || sessionsLoading.value) return
      sessionOffset.value = sessionOffset.value + sessionLimit
      fetchSessions(true)
    }

    function setStatsRange(range) {
      statsRange.value = range
      fetchData(false)
    }

    function openCustomRange(open) {
      customRangeOpen.value = open
      customRangeAnchor.value = null
      customRangeDraft.value = appliedCustomBounds
        ? { from: new Date(customFrom.value + 'T00:00:00'), to: new Date(customTo.value + 'T00:00:00') }
        : undefined
    }

    function selectCustomRangeDay(day) {
      const anchor = customRangeAnchor.value
      if (!anchor) {
        customRangeAnchor.value = day
        customRangeDraft.value = { from: day, to: undefined }
        return
      }
      const from = new Date(Math.min(anchor.getTime(), day.getTime()))
      const to = new Date(Math.max(anchor.getTime(), day.getTime()))
      applyCustomRange(from, to)
    }

    function selectRangePreset(preset) {
      const { year, month, day } = beijingCalendarParts()
      const quarter = Math.floor(month / 3) * 3
      const today = new Date(year, month, day)
      const bounds = {
        year: [new Date(year, 0, 1), today],
        quarter: [new Date(year, quarter, 1), today],
        lastQuarter: [new Date(year, quarter - 3, 1), new Date(year, quarter, 0)],
        previousMonths: [new Date(year, month - 3, 1), new Date(year, month, 0)],
      }
      applyCustomRange(...bounds[preset])
    }

    function applyCustomRange(from, to) {
      const end = new Date(to)
      end.setDate(end.getDate() + 1)
      appliedCustomBounds = { from, to: new Date(end.getTime() - 1) }
      batch(() => {
        customFrom.value = localDateString(from)
        customTo.value = localDateString(to)
        customRangeDraft.value = { from, to }
        customRangeAnchor.value = null
        statsRange.value = 'custom'
        customRangeOpen.value = false
      })
      fetchData(false)
    }

    function setModelSort(sort) {
      modelSort.value = sort
      fetchData(false)
    }

    const routeStateMod = await loadModule('./modules/route-state.js?v=session-trace-20260820-2')
    const {
      parseTraceRouteHash,
      serializeTraceRouteHash,
      canonicalizeTraceTypes,
      toggleTraceTypeSelection,
    } = routeStateMod

    function parseRoute() {
      const hash = location.hash || '#/summary'
      const traced = parseTraceRouteHash(hash)
      if (traced.kind === 'share') {
        return {
          tab: 'share',
          sessionId: null,
          agentRunId: null,
          shareToken: traced.shareToken,
          types: traced.types,
          node: traced.node,
          child: traced.child,
        }
      }
      if (traced.kind === 'sessions') {
        return {
          tab: 'sessions',
          sessionId: traced.sessionId,
          agentRunId: null,
          types: traced.types,
          node: traced.node,
          child: traced.child,
        }
      }
      const raw = hash.replace(/^#/, '')
      const [path, query = ''] = raw.split('?')
      const params = new URLSearchParams(query)
      const parts = path.split('/').filter(Boolean)
      if (parts[0] === 'agent-runs' && parts[1]) {
        return { tab: 'agent-runs', sessionId: null, agentRunId: decodeURIComponent(parts[1]), types: [], node: null, child: null }
      }
      const tab = parts[0] || 'summary'
      return {
        tab: VALID_TABS.includes(tab) ? tab : 'summary',
        sessionId: null,
        agentRunId: null,
        types: [],
        node: null,
        child: null,
        matterId: params.get('matter') || null,
        matterTab: params.get('tab') || null,
        archiveId: params.get('archive') || null,
        helpArticleId: params.get('article') || null,
      }
    }

    function syncRouteFromHash() {
      const r = parseRoute()
      if (r.shareToken) return
      const wasInDetail = routeSessionId.value != null
      const prevSessionId = routeSessionId.value
      const sessionChanged = prevSessionId !== r.sessionId
      batch(() => {
        activeTab.value = r.tab
        routeSessionId.value = r.sessionId
        routeAgentRunId.value = r.agentRunId
        if (r.agentRunId) selectedAgentRunId.value = r.agentRunId
        if (r.tab === 'matters') {
          if (r.matterId) selectedMatterId.value = r.matterId
          selectedMatterTab.value = r.matterTab === 'archive' ? 'archive' : 'summary'
          if (r.archiveId) selectedArchiveId.value = r.archiveId
        }
        if (r.tab === 'help' && r.helpArticleId) {
          selectedHelpArticleId.value = r.helpArticleId
        }
        if (r.sessionId) {
          traceTypes.value = (r.types || []).length === 1 ? r.types : []
          selectedTraceKey.value = r.node
          routeTraceChild.value = r.child
        } else {
          traceTypes.value = []
          selectedTraceKey.value = null
          routeTraceChild.value = null
          traceAutoFocusKey.value = null
          traceDeepLinkFocus.value = false
        }
      })
      if (r.sessionId) {
        if (sessionChanged) expandedSubagents.value = {}
        fetchSessionDetail(r.sessionId, { fromRoute: true })
      } else if (wasInDetail && r.tab === 'sessions') {
        fetchData(false)
      }
    }

    let publicShareRequestVersion = 0
    let publicShareTraceRequestVersion = 0
    function clearPublicShareTrace() {
      publicShareTraceRequestVersion += 1
      publicShareTraceItems.value = []
      publicShareTraceLoading.value = false
      publicShareTraceLoadingMore.value = false
      publicShareTraceError.value = ''
      publicShareTraceNextOffset.value = null
    }

    async function fetchPublicShareTrace(token, append = false) {
      const offset = append ? publicShareTraceNextOffset.value : 0
      if (append && offset == null) return
      const requestVersion = ++publicShareTraceRequestVersion
      batch(() => {
        if (append) publicShareTraceLoadingMore.value = true
        else {
          publicShareTraceLoading.value = true
          publicShareTraceItems.value = []
          publicShareTraceNextOffset.value = null
        }
        publicShareTraceError.value = ''
      })
      try {
        const params = new URLSearchParams({ limit: '50', offset: String(offset || 0) })
        const res = await fetch('/v1/public/session-shares/' + encodeURIComponent(token) + '/trace?' + params.toString())
        const data = await res.json().catch(() => ({}))
        if (requestVersion !== publicShareTraceRequestVersion) return
        if (!res.ok || !Array.isArray(data.items) || !data.pagination) {
          publicShareTraceError.value = '调用列表加载失败，请稍后重试。'
          return
        }
        const nextItems = data.items.filter((item) => item && typeof item.key === 'string')
        if (append) {
          const existing = new Set(publicShareTraceItems.value.map((item) => item.key))
          publicShareTraceItems.value = publicShareTraceItems.value.concat(
            nextItems.filter((item) => !existing.has(item.key)),
          )
        } else {
          publicShareTraceItems.value = nextItems
        }
        publicShareTraceNextOffset.value = Number.isInteger(data.pagination.next_offset)
          ? data.pagination.next_offset
          : null
      } catch (err) {
        if (requestVersion === publicShareTraceRequestVersion) {
          publicShareTraceError.value = '调用列表加载失败，请稍后重试。'
        }
      } finally {
        if (requestVersion === publicShareTraceRequestVersion) {
          publicShareTraceLoading.value = false
          publicShareTraceLoadingMore.value = false
        }
      }
    }

    async function fetchPublicShare(token) {
      const requestVersion = ++publicShareRequestVersion
      const requestedNode = selectedTraceKey.value
      const requestedChild = routeTraceChild.value
      batch(() => {
        shareMode.value = true
        routeShareToken.value = token
        routeSessionId.value = null
        publicShareLoading.value = true
        publicShareError.value = ''
        publicShareErrorTitle.value = ''
        publicShareExpiresAt.value = null
        publicShareAgentPrompt.value = ''
        publicShareSession.value = null
        publicShareScope.value = { types: [], node: null, child: null }
        traceTypes.value = []
        authChecking.value = false
      })
      try {
        const res = await fetch('/v1/public/session-shares/' + encodeURIComponent(token))
        const data = await res.json().catch(() => ({}))
        if (requestVersion !== publicShareRequestVersion) return
        if (!res.ok || !data.session) {
          if (res.status === 410) {
            publicShareErrorTitle.value = '分享已过期'
            publicShareError.value = '此会话分享已超过有效期。'
          } else if (res.status === 404) {
            publicShareErrorTitle.value = '分享链接无效或已撤回'
            publicShareError.value = '请检查链接，或联系分享者重新创建。'
          } else {
            publicShareErrorTitle.value = '分享内容加载失败'
            publicShareError.value = '服务暂时无法加载此分享，请稍后重试。'
          }
          return
        }
        const session = data.session
        const rawScope = data.scope && typeof data.scope === 'object' ? data.scope : {}
        const scope = {
          types: canonicalizeTraceTypes(Array.isArray(rawScope.types) ? rawScope.types : []),
          node: typeof rawScope.node === 'string' && rawScope.node ? rawScope.node : null,
          child: typeof rawScope.child === 'string' && rawScope.child ? rawScope.child : null,
        }
        batch(() => {
          publicShareSession.value = session
          publicShareScope.value = scope
          traceTypes.value = []
          selectedTraceKey.value = scope.node || requestedNode
          routeTraceChild.value = scope.node ? scope.child : requestedChild
          sessionDetails.value = {
            ...sessionDetails.value,
            [session.id]: { session, AISummary: data.summary_markdown || session.AISummary || '' },
          }
          publicShareExpiresAt.value = data.share?.expires_at || null
          publicShareAgentPrompt.value = typeof data.agent_prompt === 'string' ? data.agent_prompt : ''
        })
        replaceTraceHash()
        await fetchPublicShareTrace(token)
      } catch (err) {
        if (requestVersion === publicShareRequestVersion) {

    const BEIJING_TIME_FORMAT = new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',

    function formatDateTime(iso) {
      if (!iso) return '—'
      const d = new Date(iso)
      if (Number.isNaN(d.getTime())) return '—'
      const parts = BEIJING_TIME_FORMAT.formatToParts(d).reduce((acc, part) => {
        acc[part.type] = part.value
        return acc
      }, {})
      return parts.year + '-' + parts.month + '-' + parts.day + ' ' + parts.hour + ':' + parts.minute + ':' + parts.second
    }

    /** 北京时区日历日 YYYY-MM-DD，用于「今天/昨天」口语化 */
    function beijingYmd(date) {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).formatToParts(date).reduce((acc, part) => {
        acc[part.type] = part.value
        return acc
      }, {})
      return parts.year + '-' + parts.month + '-' + parts.day
    }

    function beijingHm(date) {
      const parts = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23',
      }).formatToParts(date).reduce((acc, part) => {
        acc[part.type] = part.value
        return acc
      }, {})
      return parts.hour + ':' + parts.minute
    }

    /** 口语化相对时间：今天 3 分钟前 / 昨天 2 小时前 / 前天 15:32 */
    function formatRelativeTime(iso) {
      if (!iso) return '—'
      const d = new Date(iso)
      if (Number.isNaN(d.getTime())) return '—'

      const now = Date.now()
      let diff = now - d.getTime()
      if (diff < 0) diff = 0

      const sec = Math.floor(diff / 1000)
      if (sec < 45) return '刚刚'

      const min = Math.floor(sec / 60)
      const hour = Math.floor(min / 60)

      const targetDay = beijingYmd(d)
      const today = beijingYmd(new Date(now))
      const yesterday = beijingYmd(new Date(now - 86400000))
      const dayBefore = beijingYmd(new Date(now - 2 * 86400000))

      if (targetDay === today) {
        if (min < 60) return '今天 ' + min + ' 分钟前'
        return '今天 ' + hour + ' 小时前'
      }
      if (targetDay === yesterday) {
        if (min < 60) return '昨天 ' + min + ' 分钟前'
        if (hour < 24) return '昨天 ' + hour + ' 小时前'
        return '昨天 ' + beijingHm(d)
      }
      if (targetDay === dayBefore) return '前天 ' + beijingHm(d)

      const days = Math.floor(hour / 24)
      if (days < 7) return days + ' 天前'

      const parts = BEIJING_TIME_FORMAT.formatToParts(d).reduce((acc, part) => {
        acc[part.type] = part.value
        return acc
      }, {})
      const sameYear = parts.year === today.slice(0, 4)
      if (sameYear) return Number(parts.month) + '月' + Number(parts.day) + '日 ' + parts.hour + ':' + parts.minute
      return parts.year + '-' + parts.month + '-' + parts.day + ' ' + parts.hour + ':' + parts.minute
    }

    /** 模型图标匹配逻辑（对齐 shared/model-id canonicalize，长名优先） */
    const MODEL_ICON_BASE = [
      'claudecodeinternal', 'codexinternal', 'codebuddy', 'geminicli',
      'claude', 'composer', 'cursor', 'deepseek', 'doubao', 'gemini', 'gemma',
      'glm', 'gpt', 'grok', 'hunyuan', 'hy', 'imate', 'kimi', 'knot', 'longcat',
      'minimax', 'qwen', 'seed', 'tapd', 'with', 'yuanbao', 'claw', 'echo', 'gongfeng'
    ];
    const MODEL_ICON_NAMES = MODEL_ICON_BASE.slice().sort((a, b) => b.length - a.length);
    const MODEL_ICON_EXT = {}
    MODEL_ICON_BASE.forEach((name) => {
      MODEL_ICON_EXT[name] = name === 'knot' || name === 'cursor' ? 'png' : 'svg'
    })
    MODEL_ICON_EXT.unknown = 'svg'
    /** 品牌别名 → 已有图标文件（对齐 model-id / 定价族） */
    const MODEL_ICON_ALIASES = {
      hy3: 'hy',
      hunyuan3: 'hy',
      hunyuan: 'hy',
      moonshot: 'kimi',
      anthropic: 'claude',
      openai: 'gpt',
      xai: 'grok',
      google: 'gemini',
      aliyun: 'qwen',
      zhipu: 'glm',
    }
    const MODEL_CHANNEL_SUFFIXES = [
      '-volc-ioa', '-ioa', '-official', '-external', '-internal', '-preview',
    ]

    function normalizeModelKey(name) {
      return String(name || '').trim().toLowerCase()
    }

    function stripModelName(name) {
      return normalizeModelKey(name).replace(/[^a-z0-9]/g, '')
    }

    /** 对齐 shared canonicalizeModelId：剥渠道后缀后再匹配品牌图标 */
    function canonicalizeModelForIcon(model) {
      let current = normalizeModelKey(model).replace(/[._]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '')
      let changed = true
      while (changed) {
        changed = false
        for (const suffix of MODEL_CHANNEL_SUFFIXES) {
          if (current.endsWith(suffix) && current.length > suffix.length) {
            current = current.slice(0, -suffix.length)
            changed = true
            break
          }
        }
      }
      if (/(^|-)\d+m$/.test(current)) current = current.replace(/-\d+m$/, '')
      if (MODEL_ICON_ALIASES[current]) return MODEL_ICON_ALIASES[current]
      // hy3 / hunyuan-3 等短别名
      if (current === 'hy3' || current === 'hunyuan-3' || current === 'hunyuan3') return 'hy'
      return current
    }

    function modelIconFile(icon) {
      const mapped = MODEL_ICON_ALIASES[icon] || icon
      const ext = MODEL_ICON_EXT[mapped] || 'svg'
      return '/model-icons/' + mapped + '.' + ext
    }

    function matchIconFromStripped(stripped) {
      if (!stripped) return null
      const key = stripped.toLowerCase()
      for (const icon of MODEL_ICON_NAMES) {
        const iconKey = icon.toLowerCase()
        if (key.includes(iconKey)) return icon
      }
      if (key.length >= 3) {
        for (const icon of MODEL_ICON_NAMES) {
          const iconKey = icon.toLowerCase()
          if (iconKey.includes(key)) return icon
        }
      }
      let best = null
      let bestLen = 0
      for (const icon of MODEL_ICON_NAMES) {
        const iconKey = icon.toLowerCase()
        let prefixLen = 0
        const minLen = Math.min(key.length, iconKey.length)
        for (let i = 0; i < minLen; i++) {
          if (key[i] !== iconKey[i]) break
          prefixLen++
        }
        if (prefixLen >= 3 && prefixLen > bestLen) {
          bestLen = prefixLen
          best = icon
        }
      }
      return best
    }

    function resolveModelIconUrl(modelName, providerName) {
      const keys = []
      const canonical = canonicalizeModelForIcon(modelName)
      const modelKey = stripModelName(canonical)
      const rawKey = stripModelName(modelName)
      const providerKey = stripModelName(providerName)
      if (modelKey) keys.push(modelKey)
      if (rawKey && rawKey !== modelKey) keys.push(rawKey)
      if (providerKey) keys.push(providerKey)
      if (modelKey && providerKey) keys.push(providerKey + modelKey, modelKey + providerKey)
      for (const stripped of keys) {
        const icon = matchIconFromStripped(stripped)
        if (icon) return modelIconFile(icon)
      }
      // o 系列（o3 / o4-mini）归到 gpt
      if (/(^|-)o\d/.test(canonical) || /^o\d/.test(modelKey)) return modelIconFile('gpt')
      return modelIconFile('unknown')
    }

    /** 将消息内容渲染为可读文本，兼容历史 JSON 脏数据 */
    function formatMessageContent(content) {
      if (content == null) return ''
      if (typeof content !== 'string') return String(content)
      const trimmed = content.trim()
      if (!trimmed) return ''
      if (!trimmed.startsWith('{') && !trimmed.startsWith('[')) return trimmed
      try {
        const parsed = JSON.parse(trimmed)
        if (typeof parsed === 'string') return parsed
        if (parsed.summary?.body) return parsed.summary.body
        if (parsed.summary?.title) return parsed.summary.title
        if (typeof parsed.text === 'string') return parsed.text
        if (typeof parsed.prompt === 'string') return parsed.prompt
        if (Array.isArray(parsed)) {
          return parsed
            .filter(p => p && p.type === 'text' && p.text)
            .map(p => p.text)
            .join('\n')
            .trim() || trimmed
        }
        return trimmed
      } catch {
        return trimmed
      }
    }

      try {

    /** 拉取子会话详情：缓存命中或写入 childDetails 成功返回 true，失败返回 false */
    async function fetchChildDetail(rootSessionId, childSessionId, sessionMeta) {
      const root = sessionDetails.value[rootSessionId]
      if (!root) return false
      const existing = root.childDetails && root.childDetails[childSessionId]
      if (existing && existing.messages) {
        if (sessionMeta && !existing.session) {
          const prev = sessionDetails.value[rootSessionId] || {}
          sessionDetails.value = {
            ...sessionDetails.value,
            [rootSessionId]: {
              ...prev,
              childDetails: {
                ...(prev.childDetails || {}),
                [childSessionId]: { ...existing, session: sessionMeta },
              },
            },
          }
        }
        return true
      }
      try {
        /** 子详情请求必须 ok，否则视为失败 */
        const readOkJson = (res) => {
          if (!res || !res.ok) throw new Error('child-detail-failed')
          return res.json()
        }
        const fetches = [
          apiFetch('/v1/sessions/' + encodeURIComponent(childSessionId) + '/messages').then(readOkJson),
          apiFetch('/v1/sessions/' + encodeURIComponent(childSessionId) + '/turns').then(readOkJson),
          apiFetch('/v1/sessions/' + encodeURIComponent(childSessionId) + '/tool-calls').then(readOkJson),
          apiFetch('/v1/sessions/' + encodeURIComponent(childSessionId) + '/children').then(readOkJson),
        ]
        if (!sessionMeta) {
          fetches.push(apiFetch('/v1/sessions/' + encodeURIComponent(childSessionId)).then(readOkJson))
        }
        const results = await Promise.all(fetches)
        const msgs = results[0]
        const turns = results[1]
        const tools = results[2]
        const children = results[3]
        const session = sessionMeta || results[4] || null
        const prev = sessionDetails.value[rootSessionId] || {}
        if (!sessionDetails.value[rootSessionId]) return false
        batch(() => {
          sessionDetails.value = {
            ...sessionDetails.value,
            [rootSessionId]: {
              ...prev,
              childDetails: {
                ...(prev.childDetails || {}),
                [childSessionId]: { messages: msgs, turns, tools, children, session },
              },
            },
          }
        })
        const stored = sessionDetails.value[rootSessionId]
        return !!(stored && stored.childDetails && stored.childDetails[childSessionId] && stored.childDetails[childSessionId].messages)
      } catch {
        // silent
        return false
      }
    }

    /** 沿 parent_session_id 展开祖先链；任一层子详情失败则停止并返回 false */
    async function expandChildAncestorChain(rootSessionId, childSessionId) {
      if (!childSessionId || String(childSessionId) === String(rootSessionId)) return true
      const chain = []
      const visited = new Set()
      let currentId = childSessionId
      while (currentId && String(currentId) !== String(rootSessionId)) {
        if (visited.has(currentId) || chain.length >= TRACE_CHILD_ANCESTOR_MAX) return false
        visited.add(currentId)
        const session = await apiFetch('/v1/sessions/' + encodeURIComponent(currentId))
          .then((r) => r.ok ? r.json() : null)
          .catch(() => null)
        if (!session || !session.id) return false
        chain.push({ id: currentId, session })
        currentId = session.parent_session_id || null
      }
      if (String(currentId) !== String(rootSessionId)) return false
      const expanded = { ...expandedSubagents.value }
      const ordered = chain.slice().reverse()
      for (const step of ordered) {
        const loaded = await fetchChildDetail(rootSessionId, step.id, step.session)
        if (!loaded) return false
        expanded[step.id] = true
        expandedSubagents.value = { ...expanded }
      }
      return true
    }

    function replaceTraceHash() {
      if (shareMode.value && routeShareToken.value) {
        const hash = serializeTraceRouteHash({
          kind: 'share',
          shareToken: routeShareToken.value,
          types: publicShareScope.value.types,
          node: publicShareScope.value.node || selectedTraceKey.value,
          child: publicShareScope.value.node ? publicShareScope.value.child : routeTraceChild.value,
        })
        if (location.hash !== hash) history.replaceState(null, '', hash)
        return
      }
      const sessionId = routeSessionId.value
      if (!sessionId) return
      const hash = serializeTraceRouteHash({
        kind: 'sessions',
        sessionId,
        types: traceTypes.value,
        node: selectedTraceKey.value,
        child: routeTraceChild.value,
      })
      if (location.hash !== hash) history.replaceState(null, '', hash)
    }

    /** 提交调用链选中：phase=pending 保留显式 node/child 且不写 hash，final 清理无效选择 */
    function commitTraceSelection(sessionId, items, requestedNode, options = {}) {
      const list = items || []
      const pending = options.phase === 'pending'
      const resolved = resolveTraceSelection(list, requestedNode, traceTypes.value)
      const resolvedItem = resolved ? list.find((it) => it.key === resolved) : null
      const key = (pending || resolvedItem || requestedNode == null || requestedNode === '')
        ? resolved
        : null
      const item = key ? list.find((it) => it.key === key) : null
      batch(() => {
        selectedTraceKey.value = key
        if (!pending) {
          routeTraceChild.value = traceChildQuery(item, sessionId)
        }
        if (!pending && options.scroll && key) {
          traceAutoFocusKey.value = key
          traceDeepLinkFocus.value = !!(options.deepLink && resolvedItem && resolved === requestedNode)
        }
      })
      if (!pending) replaceTraceHash()
      return key
    }

    function selectTraceItem(item, sessionId) {
      if (!item) return
      const nextKey = toggleTraceSelectionKey(selectedTraceKey.value, item.key)
      batch(() => {
        selectedTraceKey.value = nextKey
        routeTraceChild.value = nextKey ? traceChildQuery(item, sessionId) : null
        traceAutoFocusKey.value = null
        traceDeepLinkFocus.value = false
      })
      replaceTraceHash()
    }

    function toggleTraceCategory(category, items, sessionId) {
      traceTypes.value = toggleTraceTypeSelection(traceTypes.value, category)
      commitTraceSelection(sessionId, items, selectedTraceKey.value)
    }

    /** 折叠 subagent 时，若当前选中落在子树内则清空选择并回写 URL */
    async function toggleSubagent(rootSessionId, childSessionId) {
      const expanded = { ...expandedSubagents.value }
      const next = !expanded[childSessionId]
      /** 按当前展开状态重算扁平时间线 */
      const timelineOf = () => {
        const latest = sessionDetails.value[rootSessionId]
        const latestSession = sessions.value.find(s => s.id === rootSessionId) || latest?.session
        return mergeForkTraceItems(latestSession, latest)
      }
      if (next) {
        expanded[childSessionId] = true
        expandedSubagents.value = expanded
        const ok = await fetchChildDetail(rootSessionId, childSessionId)
        if (!ok) {
          expandedSubagents.value = { ...expandedSubagents.value, [childSessionId]: false }
        }
        return
      }
      const before = timelineOf()
      expanded[childSessionId] = false
      expandedSubagents.value = expanded
      const after = timelineOf()
      const currentKey = selectedTraceKey.value
      if (currentKey && before.some((it) => it.key === currentKey) && !after.some((it) => it.key === currentKey)) {
        commitTraceSelection(rootSessionId, after, null)
      }
    }

    let sessionDetailRequestVersion = 0
    async function fetchSessionDetail(sessionId, options = {}) {
      const requestVersion = ++sessionDetailRequestVersion
      const requestedNode = selectedTraceKey.value
      const requestedChild = routeTraceChild.value
      const deepLink = !!(options.fromRoute && requestedNode)

      const finish = async (detail, session) => {
        if (requestVersion !== sessionDetailRequestVersion) return
        let validChild = true
        if (requestedChild) {
          // pending：先保住 URL 上的显式 node/child，等子链补齐后再 final
          const pendingLatest = sessionDetails.value[sessionId] || detail
          const pendingSession = sessions.value.find(s => s.id === sessionId) || pendingLatest?.session || session
          commitTraceSelection(sessionId, mergeForkTraceItems(pendingSession, pendingLatest), requestedNode, { phase: 'pending' })
          if (requestVersion !== sessionDetailRequestVersion) return
          validChild = await expandChildAncestorChain(sessionId, requestedChild)
          if (requestVersion !== sessionDetailRequestVersion) return
          if (!validChild) {
            routeTraceChild.value = null
          }
        }
        const latest = sessionDetails.value[sessionId] || detail
        const latestSession = sessions.value.find(s => s.id === sessionId) || latest?.session || session
        const items = mergeForkTraceItems(latestSession, latest)
        const nodePresent = !!(requestedNode && items.some((it) => it.key === requestedNode))
        const childHydrated = !requestedChild || (validChild && (!requestedNode || nodePresent))
        commitTraceSelection(sessionId, items, requestedNode, {
          scroll: true,
          deepLink: !!(deepLink && childHydrated && nodePresent),
        })
      }

      const cached = sessionDetails.value[sessionId]
      const cachedSession = sessions.value.find(s => s.id === sessionId) || cached?.session || null
      if (cached && (!isForkSession(cachedSession) || cached.forkParent)) {
        await finish(cached, cachedSession)
        return
      }
      try {
        const sessionRes = await apiFetch('/v1/sessions/' + sessionId).then(r => r.json()).catch(() => null)
        const forkParentId = sessionRes?.fork_parent_session_id || null
        const fetches = [
          apiFetch('/v1/sessions/' + sessionId + '/messages').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + sessionId + '/turns').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + sessionId + '/tool-calls').then(r => r.json()).catch(() => []),
          apiFetch('/v1/sessions/' + sessionId + '/children').then(r => r.json()).catch(() => []),
        ]
        if (forkParentId) {
          fetches.push(apiFetch('/v1/sessions/' + forkParentId).then(r => r.json()).catch(() => null))
          fetches.push(apiFetch('/v1/sessions/' + forkParentId + '/messages?limit=1').then(r => r.json()).catch(() => []))
        }
        const results = await Promise.all(fetches)
        if (requestVersion !== sessionDetailRequestVersion) return
        const msgs = results[0]
        const turns = results[1]
        const tools = results[2]
        const children = results[3]
        const forkParent = forkParentId ? results[4] : null
        const forkParentMsgs = forkParentId ? results[5] : null
        const childToolLists = await Promise.all(
          (Array.isArray(children) ? children : []).map((ch) =>
            apiFetch('/v1/sessions/' + encodeURIComponent(ch.id) + '/tool-calls').then(r => r.json()).catch(() => []),
          ),
        )
        if (requestVersion !== sessionDetailRequestVersion) return
        const childToolCallIds = {}
        for (const list of childToolLists) {
          if (!Array.isArray(list)) continue
          for (const t of list) {
            if (t && t.call_id) childToolCallIds[t.call_id] = true
          }
        }
        const prev = sessionDetails.value[sessionId] || {}
        const detail = {
          messages: msgs,
          turns,
          tools,
          children,
          childDetails: prev.childDetails || {},
          childToolCallIds,
          session: sessionRes,
          forkParent,
          forkParentFirstMessage: Array.isArray(forkParentMsgs) ? forkParentMsgs[0] : null,
        }
        batch(() => {
          sessionDetails.value = { ...sessionDetails.value, [sessionId]: detail }
        })
        await finish(detail, sessionRes)
      } catch {
        // silent
      }
    }

      if (SessionsListPage) return
      const mod = await loadModule('./modules/sessions-list.eficy.js?v=sessions-ai-search-20260718-1')
      const _SessionRow = mod.createSessionRow({ formatTokens, formatCost, formatDateTime, formatRelativeTime, formatSessionDuration, routeSessionId, openSession, peek, ChevronIcon, resolveAgentIconUrl, formatAgentLabel, resolveModelIconUrl })
      SessionsListPage = mod.createSessionsListPage({
        sessions,
        sessionLimit,
        sessionOffset,
        sessionHasMore,
        sessionQuery,
        sessionSearchInput,
        sessionsLoading,
        sessionAiSearchLoading,
        sessionAiResultsMode,
        sessionAiResultsQuery,
        sessionAiMatchedCount,
        runSessionSearch,
        runAiSessionSearch,
        clearSessionSearch,
        prevSessionPage,
        nextSessionPage,
        SectionTitle,
        EmptyState,
        signal,
        SessionRow: _SessionRow,
      })
      loadedSessionsList.value = true
    }

    const SessionsListPageWrapper = component(() => {
      if (!loadedSessionsList.value) return null
      return <SessionsListPage />
    })

    // ─── Agent config page ───
    let AgentConfigPage = null
    async function loadAgentConfigPage() {
      if (AgentConfigPage) return
      const mod = await loadModule('./modules/agent-config.eficy.js?v=memory-tools-20261029')
      AgentConfigPage = mod.createAgentConfigPage({
        apiFetch,
        selectedAgentId,
        activeTab,
        navigate,
        SectionTitle,
        Button, Input, Textarea, Label,
      })
      loadedAgentConfig.value = true
    }

    const AgentConfigPageWrapper = component(() => {
      if (!loadedAgentConfig.value) return null
      return <AgentConfigPage />
    })

    // ─── Agent runs page ───
    let AgentRunsPage = null
    async function loadAgentRunsPage() {
      if (AgentRunsPage) return
      const mod = await loadModule('./modules/agent-runs.eficy.js?v=agent-run-tool-summary-20260718-1')
      AgentRunsPage = mod.createAgentRunsPage({
        apiFetch,
        selectedAgentRunId,
        routeAgentRunId,
        activeTab,
        navigate,
        openAgentRun,
        openSession,
        formatDateTime,
        SectionTitle,
      })
      loadedAgentRuns.value = true
    }

    const AgentRunsPageWrapper = component(() => {
      if (!loadedAgentRuns.value) return null
      return <AgentRunsPage />
    })

    // ─── System config page ───
    let SystemConfigPage = null
    async function loadSystemConfigPage() {
      if (SystemConfigPage) return
      const mod = await loadModule('./modules/system-config.eficy.js?v=agent-api-20260708-4')
      SystemConfigPage = mod.createSystemConfigPage({
        apiFetch,
        selectedProviderId,
        activeTab,
        cursorStatus,
        cursorDialogOpen,
        providerDialogOpen,
        fetchCursorStatus,
        SectionTitle,
        Button, Input, Label,
        Dialog, DialogClose, DialogContent, DialogDescription, DialogFooter, DialogHeader, DialogTitle,
      })
      loadedSystemConfig.value = true
    }

    const SystemConfigPageWrapper = component(() => {
      if (!loadedSystemConfig.value) return null
      return <SystemConfigPage />
    })

    // ─── Matters archive page ───
    let MattersPage = null
    async function loadMattersPage() {
      if (MattersPage) return
      const mod = await loadModule('./modules/matters.eficy.js?v=beijing-range-20261019')
      MattersPage = mod.createMattersPage({
        apiFetch,
        selectedMatterId,
        selectedMatterTab,
        selectedArchiveId,
        activeTab,
        focusMatterRoute,
        SectionTitle,
        Button,
        Dialog,
        DialogClose,
        DialogContent,
        DialogDescription,
        DialogFooter,
        DialogHeader,
        DialogTitle,
      })
      loadedMatters.value = true
    }

    const MattersPageWrapper = component(() => {
      if (!loadedMatters.value) return null
      return <MattersPage />
    })

    let MemoriesPage = null
    async function loadMemoriesPage() {
      if (MemoriesPage) return
      const mod = await loadModule('./modules/memories.eficy.js?v=memory-evidence-20261029')
      MemoriesPage = mod.createMemoriesPage({ apiFetch, activeTab, navigate, selectedAgentId, formatDateTime })
      loadedMemories.value = true
    }

    const MemoriesPageWrapper = component(() => {
      if (!loadedMemories.value) return null
      return <MemoriesPage />
    })

    // ─── Help center page ───
    let HelpCenterPage = null
    async function loadHelpCenterPage() {
      if (HelpCenterPage) return
      const mod = await loadModule('./modules/help-center.eficy.js?v=runmark-env-20261029')
      HelpCenterPage = mod.createHelpCenterPage({
        apiFetch,
        selectedHelpArticleId,
        activeTab,
        focusHelpArticleRoute,
        SectionTitle,
      })
      loadedHelpCenter.value = true
    }

    const HelpCenterPageWrapper = component(() => {
      if (!loadedHelpCenter.value) return null
      return <HelpCenterPage />
    })

    // 启动模块加载
    loadSummaryPanels()
    loadModelsPage()
    loadSessionsListPage()
    loadAgentConfigPage()
    loadAgentRunsPage()
    loadSystemConfigPage()
    loadMattersPage()
    loadMemoriesPage()
    loadHelpCenterPage()

    // ─── Session Detail（密集 trace 视图） ───

    // 懒加载会话详情模块（仅在路由到会话详情时加载）
    let SessionDetailView = null
    async function ensureSessionDetailView() {
      if (SessionDetailView) return
      const mod = await loadModule("./modules/session-detail.eficy.js?v=session-trace-20260820-6")
      SessionDetailView = mod.createSessionDetailView({
        apiFetch,
        sessions, sessionDetails, routeSessionId, routeTraceChild, selectedTraceKey, traceAutoFocusKey, expandedSubagents,
        traceTypes, traceDeepLinkFocus,
        publicShareTraceItems, publicShareTraceLoading, publicShareTraceLoadingMore,
        publicShareTraceError, publicShareTraceNextOffset, routeShareToken, fetchPublicShareTrace,
        sanitizeHtml: (html) => DOMPurify.sanitize(html, { USE_PROFILES: { html: true } }),
        navigate, openSession, toggleSubagent,
        selectTraceItem, toggleTraceCategory,
        formatDateTime, formatSessionDuration, formatDuration, formatTokens, formatCost,
        forkParentSessionId, mergeForkTraceItems,
        TRACE_CATEGORIES, TRACE_FILTER_LABELS, TRACE_FILTER_DOTS,
        filterTraceItems, ChevronIcon,
        Dialog, DialogContent, DialogDescription, DialogFooter, DialogHeader, DialogTitle, Button,
      })
    }

    const loadedSessionDetail = signal(false)
    const SessionDetailWrapper = component(({ sessionId }) => {
      effect(() => {
        if (!SessionDetailView && sessionId) {
          ensureSessionDetailView().then(() => { loadedSessionDetail.value = true })
        } else {
          loadedSessionDetail.value = true
        }
      })
      if (!loadedSessionDetail.value) return <LoadingScreen />
      return <SessionDetailView
        sessionId={sessionId}
        readOnly={shareMode.value}
        shareMode={shareMode.value}
        shareCategories={shareMode.value ? publicShareScope.value.types : []}
        shareRestricted={shareMode.value && (publicShareScope.value.types.length > 0 || publicShareScope.value.node != null)}
        agentPrompt={shareMode.value ? publicShareAgentPrompt.value : ''}
      />
    })

    // ─── Sidebar Nav Item ───
    const NavItem = component(({ tab, label, icon }) => (
      <div
        className={'sidebar-nav-item' + (activeTab.value === tab ? ' sidebar-nav-item--active' : '')}
        onClick={() => navigate(tab)}
      >
        <span className="sidebar-nav-icon">{icon}</span>
        <span className="sidebar-nav-text">{label}</span>
      </div>
    ))

    // ─── Login Screen ───
    const LoginScreen = component(() => (
      <div className="login-shell fade-up">
        <div className="login-card">
          <img className="login-brand-logo" src="./brand/runmark-logo.png" alt="Runmark" />
          {authError.value ? <div className="login-error">{authError.value}</div> : null}
          <div className="login-field">
            <label className="login-label">访问密码</label>
            <input
              className="login-input"
              type="password"
              placeholder="访问密码"
              {...bind(loginPassword)}
              onKeyDown={(e) => { if (e.key === 'Enter') login() }}
            />
          </div>
          <button
            className="login-btn"
            onClick={() => login()}
            disabled={loginSubmitting.value || !loginPassword.value.trim()}
          >
            {loginSubmitting.value ? '验证中…' : '登录'}
          </button>
          <div className="login-hint">
            <div style={{ marginBottom: '6px', fontWeight: 600, color: 'var(--text-primary)' }}>密码在哪里？</div>
            访问密码与 <strong>当前正在访问的服务</strong> 的 API Key 一致（部署时 <code>setup.sh</code> 会打印）。
            <br /><br />
            你正在访问：<code>{location.host}</code>
            <br /><br />
            也可在本机配置文件中查看：
            <br />
            <code>~/.config/runmark/env</code> 里的 <code>RUNMARK_API_KEY</code>（或短键 <code>apiKey</code>）
            <br /><br />
            <div style={{ marginBottom: '6px', fontWeight: 600, color: 'var(--text-primary)' }}>登录后做什么？</div>
            打开侧栏 <strong>帮助中心</strong>（<code>#/help</code>），按「统一接入配置」完成 Cursor / OpenCode / Codex 客户端上报。
          </div>
        </div>
      </div>
    ))

    // ─── Loading Screen ───
    const LoadingScreen = component(() => (
      <div className="flex items-center justify-center min-h-screen app-shell">
        <div className="text-center space-y-4">
          <div className="spinner-lg mx-auto" />
          <img className="loading-brand-logo" src="./brand/runmark-logo.png" alt="Runmark" />
        </div>
      </div>
    ))

    const PublicSharePage = component(() => {
      if (publicShareLoading.value) {
        return (
          <div className="app-shell" style={{ alignItems: 'center', justifyContent: 'center', gap: '14px', padding: '24px' }}>
            <div className="spinner-lg" />
            <img className="loading-brand-logo" src="./brand/runmark-logo.png" alt="Runmark" />
            <div style={{ color: 'var(--text-muted)', fontSize: '13px' }}>正在加载分享会话…</div>
          </div>
        )
      }
      if (publicShareError.value || !publicShareSession.value) {
        return (
          <div className="app-shell" style={{ alignItems: 'center', justifyContent: 'center', padding: '24px' }}>
            <div className="panel-card fade-up" style={{ width: 'min(460px, 100%)', padding: '28px', textAlign: 'center' }}>
              <img className="loading-brand-logo" src="./brand/runmark-logo.png" alt="Runmark" />
              <h2 style={{ margin: '20px 0 8px', color: 'var(--text-primary)', fontSize: '18px' }}>{publicShareErrorTitle.value || '分享内容无法访问'}</h2>
              <p style={{ margin: 0, color: 'var(--text-secondary)', fontSize: '13px', lineHeight: 1.7 }}>{publicShareError.value || '分享链接无效或已过期'}</p>
            </div>
          </div>
        )
      }
      const session = publicShareSession.value
      return (
        <div className="app-shell">
          <div className="public-session-page">
            <header className="public-session-header fade-up">
              <img className="sidebar-brand-logo" src="./brand/runmark-logo.png" alt="Runmark" />
              <div>只读分享 · 有效至 {formatDateTime(publicShareExpiresAt.value)}</div>
            </header>
            <SessionDetailWrapper sessionId={session.id} />
          </div>
        </div>
      )
    })

    const CursorCookieDialog = component(() => {
      const st = cursorStatus.value || {}
      const ready = st.hasCryptoKey !== false
      const linked = !!st.hasCookies
      return (
        <Dialog open={cursorDialogOpen.value} onOpenChange={(v) => { cursorDialogOpen.value = v }}>
          <DialogContent style={{ maxWidth: '520px' }}>
            <DialogHeader>
              <DialogTitle>Cursor 账单同步（可选）</DialogTitle>
              <DialogDescription>
                配置后可从 Cursor 官方 Usage API 拉取真实 token 与费用。会话归属以 Hook 上报的 session_id 为准，按入队顺序补充 cost，不会把时间窗内的账单错配到其他会话。
              </DialogDescription>
            </DialogHeader>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.6 }}>
              <div style={{ padding: '10px 12px', borderRadius: '8px', background: 'rgba(59,158,255,0.08)', border: '1px solid rgba(59,158,255,0.15)' }}>
                <strong style={{ color: 'var(--text-primary)' }}>获取 Session Token</strong>
                <ol style={{ margin: '8px 0 0', paddingLeft: '18px' }}>
                  <li>登录 <a href="https://cursor.com/dashboard" target="_blank" rel="noreferrer" style={{ color: 'var(--accent-blue)' }}>cursor.com/dashboard</a></li>
                  <li>DevTools → Application → Cookies → cursor.com</li>
                  <li>复制 <code style={{ fontSize: '12px' }}>WorkosCursorSessionToken</code> 的值</li>
                </ol>
              </div>
              {!ready ? (
                <p style={{ color: 'var(--accent-orange)' }}>服务端未配置 RUNMARK_CURSOR_CRYPTO_KEY，无法加密存储 Token。请联系管理员在 .env 中配置。</p>
              ) : null}
              <div>
                <Label htmlFor="cursor-token">WorkosCursorSessionToken</Label>
                <Textarea
                  id="cursor-token"
                  className="cursor-token-input"
                  placeholder="粘贴 Session Token（敏感信息，仅保存在本服务加密数据库）"
                  value={cursorTokenInput.value}
                  onInput={(e) => { cursorTokenInput.value = e.target.value }}
                  rows={3}
                  style={{ marginTop: '6px', fontFamily: 'ui-monospace, monospace', fontSize: '12px' }}
                />
              </div>
              <div style={{ fontSize: '12px' }}>
                <div>状态：{linked ? '已配置 Token' : '未配置'}{st.authExpired ? ' · 已过期，请重新粘贴' : ''}</div>
                {st.lastSuccessAt ? <div>上次同步：{formatDateTime(st.lastSuccessAt)}</div> : null}
                {st.pendingQueue > 0 ? <div>待对账会话：{st.pendingQueue}</div> : null}
                {st.lastError ? <div style={{ color: 'var(--accent-orange)' }}>{st.lastError}</div> : null}
                {cursorMessage.value ? <div style={{ color: 'var(--accent-green)' }}>{cursorMessage.value}</div> : null}
                {cursorError.value ? <div style={{ color: '#f87171' }}>{cursorError.value}</div> : null}
              </div>
            </div>
            <DialogFooter style={{ gap: '8px', flexWrap: 'wrap' }}>
              {linked ? (
                <Button variant="outline" onClick={() => clearCursorToken()} disabled={cursorSaving.value || cursorSyncing.value}>
                  清除
                </Button>
              ) : null}
              <Button variant="outline" onClick={() => syncCursorNow()} disabled={!linked || !st.available || cursorSyncing.value || cursorSaving.value}>
                {cursorSyncing.value ? '同步中…' : '立即同步'}
              </Button>
              <Button onClick={() => saveCursorToken()} disabled={!ready || cursorSaving.value || cursorSyncing.value}>
                {cursorSaving.value ? '保存中…' : '保存 Token'}
              </Button>
              <DialogClose asChild>
                <Button variant="ghost">关闭</Button>
              </DialogClose>
            </DialogFooter>
          </DialogContent>
        </Dialog>
      )
    })

    // ─── Dashboard App ───
    const App = component(() => {
      if (loading.value && !summary.value) {
        return <LoadingScreen />
      }

      return (
        <div className="app-shell">
          <CursorCookieDialog />
          <UpdateDialogWrapper />

          <div className="dashboard-layout">
            <aside className="sidebar fade-up fade-up-d1">
              <div className="sidebar-brand">
                <img className="sidebar-brand-logo" src="./brand/runmark-logo.png" alt="Runmark" />
                <SidebarUpdateButtonWrapper />
              </div>
              <div className="sidebar-update-mobile"><SidebarUpdateButtonWrapper /></div>
              <p className="sidebar-label">MAIN</p>
              <NavItem tab="summary" label="总览" icon={<LayoutIcon />} />
              <NavItem tab="models" label="模型" icon={<CpuIcon />} />
              <NavItem tab="sessions" label="会话" icon={<ListIcon />} />
              <NavItem tab="matters" label="事项归档" icon={<ArchiveIcon />} />
              <NavItem tab="memories" label="记忆" icon={<Brain size={14} />} />
              <div className="sidebar-spacer" />
              <div className="sidebar-divider" />
              <p className="sidebar-label">CONFIGURATION</p>
              <NavItem tab="agent-config" label="智能体配置" icon={<BotIcon />} />
              <NavItem tab="system-config" label="系统配置" icon={<SettingsIcon />} />
              <NavItem tab="help" label="帮助中心" icon={<HelpIcon />} />
            </aside>

            {/* Main Content */}
            <main className="main-content">
              {/* 首次空数据：引导去帮助中心 */}
              {!routeSessionId.value && (activeTab.value === 'summary' || activeTab.value === 'models' || activeTab.value === 'sessions') ? (
                <WelcomeSetupBanner />
              ) : null}

              {/* KPI Cards — 会话详情页隐藏 */}
              {!routeSessionId.value && (activeTab.value === 'summary' || activeTab.value === 'models' || activeTab.value === 'sessions') ? (
              <div className="fade-up fade-up-d2">
                <StatsToolbar />
              <div className="kpi-row">
                <KpiCard label="Sessions" value={kpiSessions} variant="blue" icon={<SessionsIcon />} />
                <KpiCard label="Turns" value={kpiTurns} variant="green" icon={<TurnsIcon />} />
                <KpiCard
                  label="Total Tokens"
                  value={kpiTokens}
                  variant="orange"
                  icon={<TokensIcon />}
                />
                <KpiCard label="Total Cost" value={kpiCost} variant="purple" icon={<CostIcon />} />
              </div>
              </div>
              ) : null}

              {/* ── Summary Tab ── */}
              {activeTab.value === 'summary' && !routeSessionId.value ? (
                <SummaryPanelsWrapper />
              ) : null}

              {/* ── Models Tab ── */}
              {activeTab.value === 'models' && !routeSessionId.value ? (
                <ModelsPageWrapper />
              ) : null}

              {/* ── Sessions Tab ── */}
              {activeTab.value === 'sessions' && routeSessionId.value ? (
                <SessionDetailWrapper sessionId={routeSessionId.value} />
              ) : null}

              {activeTab.value === 'sessions' && !routeSessionId.value ? (
                <SessionsListPageWrapper />
              ) : null}

              {activeTab.value === 'agent-config' && !routeSessionId.value ? (
                <AgentConfigPageWrapper />
              ) : null}

              {activeTab.value === 'agent-runs' && !routeSessionId.value ? (
                <AgentRunsPageWrapper />
              ) : null}

              {activeTab.value === 'system-config' && !routeSessionId.value ? (
                <SystemConfigPageWrapper />
              ) : null}

              {activeTab.value === 'matters' && !routeSessionId.value ? (
                <MattersPageWrapper />
              ) : null}

              {activeTab.value === 'memories' && !routeSessionId.value ? (
                <MemoriesPageWrapper />
              ) : null}

              {activeTab.value === 'help' && !routeSessionId.value ? (
                <HelpCenterPageWrapper />
              ) : null}
            </main>
          </div>
        </div>
      )
    })

    const Root = component(() => {
      if (shareMode.value) return <PublicSharePage />
      if (authChecking.value) return <LoadingScreen />
      if (!authenticated.value) return <LoginScreen />
      return <App />
    })

    // ─── Mount ───
    await initEficy()
    render(Root, document.getElementById('app'))
  </script>
</body>
</html>
